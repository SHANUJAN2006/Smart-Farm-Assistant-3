"e": "Total Surface Area of Hollow Hemisphere", "f": "TSA = 2π(R^2 + r^2) + π(R^2 - r^2) = π(3R^2 + r^2)", "d": "வெளி வளைபரப்பு + உள் வளைபரப்பு + விளிம்பு வளையம்."}, {"n": 449, "c": 5, "t": "கோளத் தொப்பியின் (Spherical Cap) கனஅளவு", "e": "Volume of a Spherical Cap", "f": "V = (1/3)πh^2(3R - h)", "d": "R = கோளத்தின் ஆரம், h = தொப்பியின் உயரம்."}, {"n": 450, "c": 5, "t": "கோளத் தொப்பியின் வளைபரப்பு", "e": "Curved Surface Area of a Spherical Cap", "f": "CSA = 2πRh", "d": "கோளத்திலிருந்து வெட்டப்பட்ட ஒரு பகுதியின் வளைபரப்பு."}, {"n": 451, "c": 5, "t": "கோளத் தொப்பியின் அடி ஆரம்", "e": "Base Radius of a Spherical Cap", "f": "a = √[h(2R - h)]", "d": "கோளத் தொப்பியின் தட்டையான வட்ட அடிப்பக்க ஆரம்."}, {"n": 452, "c": 5, "t": "கோள மண்டலத்தின் (Spherical Zone) வளைபரப்பு", "e": "Surface Area of a Spherical Zone", "f": "SA = 2πRh", "d": "இரு இணைத் தளங்களுக்கு இடைப்பட்ட கோளப் பகுதி."}, {"n": 453, "c": 5, "t": "கோளத் துண்டின் (Spherical Segment) கனஅளவு", "e": "Volume of a Spherical Segment", "f": "V = (1/6)πh(3a^2 + 3b^2 + h^2)", "d": "a, b = இரு அடிப்பக்க ஆரங்கள், h = உயரம்."}, {"n": 454, "c": 5, "t": "கோள ஆப்பு (Spherical Wedge) கனஅளவு", "e": "Volume of a Spherical Wedge", "f": "V = (θ / 360°) × (4/3)πr^3  அல்லது  (2/3)r^3φ", "d": "φ = இருதளக் கோணம் ரேடியன்களில்."}, {"n": 455, "c": 5, "t": "கோளப் பிறை (Spherical Lune) பரப்பளவு", "e": "Area of a Spherical Lune", "f": "A = 2r^2φ", "d": "φ = இரு பெருவட்டங்களுக்கு இடைப்பட்ட கோணம் (ரேடியன்)."}, {"n": 456, "c": 5, "t": "பட்டகத்தின் (Prism) கனஅளவு", "e": "Volume of a General Prism", "f": "V = B × h", "d": "B = அடிப்பக்கப் பரப்பளவு, h = உயரம்."}, {"n": 457, "c": 5, "t": "பட்டகத்தின் பக்கவாட்டுப் பரப்பளவு", "e": "Lateral Surface Area of a Prism", "f": "LSA = P × h", "d": "P = அடிப்பக்கச் சுற்றளவு, h = உயரம்."}, {"n": 458, "c": 5, "t": "பட்டகத்தின் மொத்தப் புறப்பரப்பளவு", "e": "Total Surface Area of a Prism", "f": "TSA = 2B + Ph", "d": "இரு அடிப்பக்கப் பரப்புகள் + பக்கவாட்டுப் பரப்பளவு."}, {"n": 459, "c": 5, "t": "முக்கோணப் பட்டகத்தின் கனஅளவு", "e": "Volume of a Triangular Prism", "f": "V = (1/2) × b × h_t × L", "d": "b = முக்கோண அடி, h_t = முக்கோண உயரம், L = பட்டக நீளம்."}, {"n": 460, "c": 5, "t": "அறுங்கோணப் பட்டகத்தின் கனஅளவு", "e": "Volume of a Regular Hexagonal Prism", "f": "V = (3√3 / 2)a^2h", "d": "a = அடிப்பக்கப் பக்கம், h = பட்டக உயரம்."}, {"n": 461, "c": 5, "t": "அறுங்கோணப் பட்டகத்தின் மொத்தப் புறப்பரப்பளவு", "e": "Total Surface Area of Hexagonal Prism", "f": "TSA = 6ah + 3√3a^2", "d": "ஆறு செவ்வகப் பக்கங்கள் + இரு அறுங்கோண அடிப்பக்கங்கள்."}, {"n": 462, "c": 5, "t": "பிரமிடின் (Pyramid) கனஅளவு", "e": "Volume of a General Pyramid", "f": "V = (1/3) × B × h", "d": "B = அடிப்பக்கப் பரப்பளவு, h = செங்குத்து உயரம்."}, {"n": 463, "c": 5, "t": "ஒழுங்கு பிரமிடின் பக்கவாட்டுப் பரப்பளவு", "e": "Lateral Surface Area of a Regular Pyramid", "f": "LSA = (1/2) × P × l", "d": "P = அடிப்பக்கச் சுற்றளவு, l = சாயுயரம்."}, {"n": 464, "c": 5, "t": "பிரமிடின் மொத்தப் புறப்பரப்பளவு", "e": "Total Surface Area of a Pyramid", "f": "TSA = B + (1/2)Pl", "d": "அடிப்பக்கப் பரப்பு + பக்கவாட்டு முக்கோணங்களின் பரப்பு."}, {"n": 465, "c": 5, "t": "சதுரப் பிரமிடின் கனஅளவு", "e": "Volume of a Square Pyramid", "f": "V = (1/3)a^2h", "d": "a = அடிச் சதுரத்தின் பக்கம், h = உயரம்."}, {"n": 466, "c": 5, "t": "சதுரப் பிரமிடின் சாயுயரம்", "e": "Slant Height of a Square Pyramid", "f": "l = √[h^2 + (a/2)^2]", "d": "உச்சியிலிருந்து அடிப்பக்க விளிம்பின் நடுப்புள்ளிக்கு உள்ள தூரம்."}, {"n": 467, "c": 5, "t": "சதுரப் பிரமிடின் மொத்தப் புறப்பரப்பளவு", "e": "Total Surface Area of a Square Pyramid", "f": "TSA = a^2 + 2al = a^2 + a√(a^2 + 4h^2)", "d": "அடிச் சதுரம் + நான்கு சமபக்க முக்கோணங்கள்."}, {"n": 468, "c": 5, "t": "பிரமிட் இடைக்கண்டத்தின் (Frustum of Pyramid) கனஅளவு", "e": "Volume of Frustum of a Pyramid", "f": "V = (1/3)h(B_1 + B_2 + √(B_1 × B_2))", "d": "B_1, B_2 = கீழ் மற்றும் மேல் அடிப்பக்கப் பரப்பளவுகள்."}, {"n": 469, "c": 5, "t": "பிரமிட் இடைக்கண்டத்தின் பக்கவாட்டுப் பரப்பளவு", "e": "Lateral Area of Frustum of Regular Pyramid", "f": "LSA = (1/2)(P_1 + P_2)l", "d": "P_1, P_2 = அடிப்பக்கச் சுற்றளவுகள், l = சாயுயரம்."}, {"n": 470, "c": 5, "t": "ஒழுங்கு நான்முகி (Tetrahedron) கனஅளவு", "e": "Volume of a Regular Tetrahedron", "f": "V = a^3 / (6√2)", "d": "நான்கு சமபக்க முக்கோணங்களைக் கொண்ட பிளேட்டோனிக் திண்மம்."}, {"n": 471, "c": 5, "t": "ஒழுங்கு நான்முகியின் மொத்தப் புறப்பரப்பளவு", "e": "Surface Area of a Regular Tetrahedron", "f": "SA = √3 × a^2", "d": "நான்கு சமபக்க முக்கோண முகங்களின் பரப்பளவு."}, {"n": 472, "c": 5, "t": "ஒழுங்கு நான்முகியின் உயரம்", "e": "Height of a Regular Tetrahedron", "f": "h = √(2/3) × a", "d": "ஒரு உச்சியிலிருந்து எதிர்ப்பக்க முகத்திற்கு உள்ள செங்குத்து உயரம்."}, {"n": 473, "c": 5, "t": "ஒழுங்கு நான்முகியின் உள்கோள ஆரம்", "e": "Insphere Radius of Regular Tetrahedron", "f": "r = a / (2√6) = h / 4", "d": "நான்முகிக்குள் அமையும் கோளத்தின் ஆரம்."}, {"n": 474, "c": 5, "t": "ஒழுங்கு நான்முகியின் சுற்றுக்கோள ஆரம்", "e": "Circumsphere Radius of Regular Tetrahedron", "f": "R = √(3/8) × a = 3h / 4", "d": "நான்முகியின் 4 உச்சிகள் வழியே செல்லும் கோளத்தின் ஆரம்."}, {"n": 475, "c": 5, "t": "ஒழுங்கு எண்முகி (Octahedron) கனஅளவு", "e": "Volume of a Regular Octahedron", "f": "V = (√2 / 3) × a^3", "d": "எட்டு சமபக்க முக்கோண முகங்களைக் கொண்ட திண்மம்."}, {"n": 476, "c": 5, "t": "ஒழுங்கு எண்முகியின் புறப்பரப்பளவு", "e": "Surface Area of a Regular Octahedron", "f": "SA = 2√3 × a^2", "d": "எட்டு சமபக்க முக்கோணங்களின் பரப்பளவு."}, {"n": 477, "c": 5, "t": "ஒழுங்கு எண்முகியின் மூலைவிட்டம்", "e": "Diagonal of a Regular Octahedron", "f": "d = a√2", "d": "எதிரெதிர் உச்சிகளுக்கு இடைப்பட்ட தூரம்."}, {"n": 478, "c": 5, "t": "ஒழுங்கு பன்னிருமுகி (Dodecahedron) கனஅளவு", "e": "Volume of a Regular Dodecahedron", "f": "V = [(15 + 7√5) / 4] × a^3", "d": "பன்னிரண்டு ஒழுங்கு ஐங்கோண முகங்களைக் கொண்ட திண்மம்."}, {"n": 479, "c": 5, "t": "ஒழுங்கு பன்னிருமுகியின் புறப்பரப்பளவு", "e": "Surface Area of a Regular Dodecahedron", "f": "SA = 3√(25 + 10√5) × a^2", "d": "12 ஒழுங்கு ஐங்கோணங்களின் மொத்தப் பரப்பளவு."}, {"n": 480, "c": 5, "t": "ஒழுங்கு இருபதுமுகி (Icosahedron) கனஅளவு", "e": "Volume of a Regular Icosahedron", "f": "V = [5(3 + √5) / 12] × a^3", "d": "இருபது சமபக்க முக்கோண முகங்களைக் கொண்ட திண்மம்."}, {"n": 481, "c": 5, "t": "ஒழுங்கு இருபதுமுகியின் புறப்பரப்பளவு", "e": "Surface Area of a Regular Icosahedron", "f": "SA = 5√3 × a^2", "d": "20 சமபக்க முக்கோணங்களின் மொத்தப் பரப்பளவு."}, {"n": 482, "c": 5, "t": "ஆய்லரின் பன்முகத் தேற்றம்", "e": "Euler's Polyhedron Formula", "f": "V - E + F = 2", "d": "V = உச்சிகள், E = விளிம்புகள், F = முகங்கள்."}, {"n": 483, "c": 5, "t": "டோரஸ் (Torus / வளைய வடிவம்) கனஅளவு", "e": "Volume of a Torus", "f": "V = (πr^2)(2πR) = 2π^2Rr^2", "d": "R = மைய ஆரம், r = குழாய் ஆரம்."}, {"n": 484, "c": 5, "t": "டோரஸ் புறப்பரப்பளவு", "e": "Surface Area of a Torus", "f": "SA = (2πr)(2πR) = 4π^2Rr", "d": "டோரஸ் வடிவத்தின் வெளிப்புறப் பரப்பளவு."}, {"n": 485, "c": 5, "t": "நீள்வட்டக் கோளம் (Ellipsoid) கனஅளவு", "e": "Volume of an Ellipsoid", "f": "V = (4/3)πabc", "d": "a, b, c என்பவை மூன்று அரை அச்சுகள்."}, {"n": 486, "c": 5, "t": "நீள்வட்டக் கோளத்தின் தோராயப் புறப்பரப்பு (நட் தாம்சன்)", "e": "Surface Area of Ellipsoid (Knud Thomsen)", "f": "SA ≈ 4π[(a^p b^p + b^p c^p + c^p a^p) / 3]^(1/p)", "d": "இங்கு p ≈ 1.6075."}, {"n": 487, "c": 5, "t": "நெட்டச்சு சுழல் கோளம் (Prolate Spheroid) புறப்பரப்பு", "e": "Surface Area of a Prolate Spheroid", "f": "SA = 2πa^2 + 2π(ab / e) sin^(-1)(e)", "d": "a < b; e = √(1 - a^2 / b^2)."}, {"n": 488, "c": 5, "t": "குற்றச்சு சுழல் கோளம் (Oblate Spheroid) புறப்பரப்பு", "e": "Surface Area of an Oblate Spheroid", "f": "SA = 2πa^2 + π(b^2 / e) ln[(1 + e) / (1 - e)]", "d": "a > b; e = √(1 - b^2 / a^2)."}, {"n": 489, "c": 5, "t": "பரவளையத்திண்மம் (Paraboloid) கனஅளவு", "e": "Volume of a Circular Paraboloid", "f": "V = (1/2)πr^2h", "d": "அதே அடி ஆரம் மற்றும் உயரம் கொண்ட உருளையின் கனஅளவில் பாதி."}, {"n": 490, "c": 5, "t": "பரவளையத்திண்மத்தின் வளைபரப்பு", "e": "Curved Surface Area of a Paraboloid", "f": "CSA = (πr / 6h^2)[(r^2 + 4h^2)^(3/2) - r^3]", "d": "r = அடி ஆரம், h = உயரம்."}, {"n": 491, "c": 5, "t": "பீப்பாய் (Barrel) தோராய கனஅளவு", "e": "Volume of a Barrel (Parabolic)", "f": "V = (1/15)πh(2D^2 + Dd + (3/4)d^2)", "d": "D = நடு விட்டம், d = அடி விட்டம், h = உயரம்."}, {"n": 492, "c": 5, "t": "ஆப்பு (Wedge) கனஅளவு", "e": "Volume of a Right Wedge", "f": "V = (1/6)bh(2a + c)", "d": "a, b = செவ்வக அடிப்பக்கம், c = மேல் விளிம்பு, h = உயரம்."}, {"n": 493, "c": 5, "t": "பிரிஸ்மாட்டாய்டு (Prismatoid) கனஅளவு", "e": "Prismatoid Volume Formula (Simpson's Rule)", "f": "V = (h / 6)(B_1 + 4M + B_2)", "d": "B_1, B_2 = இரு அடிப்பரப்புகள், M = நடுவெட்டுப் பரப்பு, h = உயரம்."}, {"n": 494, "c": 5, "t": "வடிவொத்த 3D திண்மங்களின் பரப்பளவு விகிதம்", "e": "Surface Area Ratio of Similar 3D Solids", "f": "SA_1 / SA_2 = (l_1 / l_2)^2", "d": "பக்க விகிதத்தின் வர்க்கத்திற்குச் சமம்."}, {"n": 495, "c": 5, "t": "வடிவொத்த 3D திண்மங்களின் கனஅளவு விகிதம்", "e": "Volume Ratio of Similar 3D Solids", "f": "V_1 / V_2 = (l_1 / l_2)^3", "d": "பக்க விகிதத்தின் கனத்திற்குச் சமம்."}, {"n": 496, "c": 5, "t": "பாப்பஸ்-குல்டினஸ் முதல் தேற்றம் (புறப்பரப்பு)", "e": "Pappus's Centroid Theorem (Surface Area)", "f": "A = s × d = s × (2πr̄)", "d": "s = வளைவரையின் நீளம், r̄ = திணிவு மையம் பயணிக்கும் ஆரம்."}, {"n": 497, "c": 5, "t": "பாப்பஸ்-குல்டினஸ் இரண்டாம் தேற்றம் (கனஅளவு)", "e": "Pappus's Centroid Theorem (Volume)", "f": "V = A × d = A × (2πr̄)", "d": "A = தளப் பரப்பு, r̄ = திணிவு மையம் சுழலும் ஆரம்."}, {"n": 498, "c": 5, "t": "காவலியேரி தத்துவம் (Cavalieri's Principle)", "e": "Cavalieri's Principle Formula", "f": "V_1 = V_2 (if A_1(y) = A_2(y) for all y)", "d": "ஒவ்வொரு உயரத்திலும் குறுக்குவெட்டுப் பரப்பு சமமெனில் கனஅளவு சமம்."}, {"n": 499, "c": 5, "t": "அடர்த்தி, நிறை மற்றும் கனஅளவு தொடர்பு", "e": "Density-Mass-Volume Formula", "f": "கனஅளவு (V) = நிறை (m) / அடர்த்தி (ρ)", "d": "திண்மப் பொருட்களின் கனஅளவை நிறையிலிருந்து காணும் சூத்திரம்."}, {"n": 500, "c": 5, "t": "கனஅளவு அலகு மாற்றம் (லிட்டர் - கன மீட்டர்)", "e": "Volume Unit Conversion", "f": "1 m^3 = 1,000 லிட்டர் = 10^6 cm^3", "d": "3D கனஅளவு கணக்கீடுகளில் பயன்படும் அடிப்படை அலகு மாற்றம்."}]}, {"id": 6, "name": "Coordinate Geometry Formulas", "f": [{"n": 501, "c": 6, "t": "இரு புள்ளிகளுக்கு இடைப்பட்ட தூரம் (2D)", "e": "Distance Formula (2D)", "f": "d = √[(x_2 - x_1)^2 + (y_2 - y_1)^2]", "d": "(x_1, y_1) மற்றும் (x_2, y_2) புள்ளிகளுக்கு இடைப்பட்ட தூரம்."}, {"n": 502, "c": 6, "t": "ஆதிப்புள்ளியிலிருந்து ஒரு புள்ளியின் தூரம்", "e": "Distance from Origin", "f": "d = √(x^2 + y^2)", "d": "(0, 0) மற்றும் (x, y) புள்ளிக்கு இடைப்பட்ட தூரம்."}, {"n": 503, "c": 6, "t": "நடுப்புள்ளி சூத்திரம் (2D)", "e": "Midpoint Formula (2D)", "f": "M = ((x_1 + x_2)/2, (y_1 + y_2)/2)", "d": "இரு புள்ளிகளை இணைக்கும் கோட்டுத்துண்டின் நடுப்புள்ளி."}, {"n": 504, "c": 6, "t": "உட்புறப் பிரிவு சூத்திரம்", "e": "Internal Section Formula", "f": "P = ((mx_2 + nx_1)/(m + n), (my_2 + ny_1)/(m + n))", "d": "m : n என்ற விகிதத்தில் உட்புறமாகப் பிரிக்கும் புள்ளி."}, {"n": 505, "c": 6, "t": "வெளிப்புறப் பிரிவு சூத்திரம்", "e": "External Section Formula", "f": "P = ((mx_2 - nx_1)/(m - n), (my_2 - ny_1)/(m - n))", "d": "m : n என்ற விகிதத்தில் வெளிப்புறமாகப் பிரிக்கும் புள்ளி."}, {"n": 506, "c": 6, "t": "முக்கோணத்தின் நடுக்கோட்டு மையம் (Centroid)", "e": "Centroid of a Triangle", "f": "G = ((x_1 + x_2 + x_3)/3, (y_1 + y_2 + y_3)/3)", "d": "முக்கோணத்தின் மூன்று நடுக்கோடுகள் சந்திக்கும் புள்ளி."}, {"n": 507, "c": 6, "t": "முக்கோணத்தின் உள்வட்ட மையம் (Incenter)", "e": "Incenter of a Triangle", "f": "I = ((ax_1 + bx_2 + cx_3)/(a+b+c), (ay_1 + by_2 + cy_3)/(a+b+c))", "d": "a, b, c = எதிர் பக்கங்களின் நீளங்கள்."}, {"n": 508, "c": 6, "t": "முக்கோணத்தின் பரப்பளவு (ஆள்கூறுகள்)", "e": "Area of a Triangle (Coordinates)", "f": "A = (1/2)|x_1(y_2 - y_3) + x_2(y_3 - y_1) + x_3(y_1 - y_2)|", "d": "மூன்று உச்சிப் புள்ளிகள் தெரிந்தால் முக்கோணத்தின் பரப்பளவு."}, {"n": 509, "c": 6, "t": "மூன்று புள்ளிகள் ஒரே கோட்டில் அமைவதற்கான நிபந்தனை", "e": "Collinearity of Three Points", "f": "x_1(y_2 - y_3) + x_2(y_3 - y_1) + x_3(y_1 - y_2) = 0", "d": "முக்கோணத்தின் பரப்பளவு 0 எனில் புள்ளிகள் ஒரே கோட்டில் அமையும்."}, {"n": 510, "c": 6, "t": "நாற்கரத்தின் பரப்பளவு (ஷூலேஸ் சூத்திரம்)", "e": "Area of a Quadrilateral (Shoelace Formula)", "f": "A = (1/2)|(x_1y_2 - y_1x_2) + (x_2y_3 - y_2x_3) + (x_3y_4 - y_3x_4) + (x_4y_1 - y_4x_1)|", "d": "நான்கு முனைப் புள்ளிகள் தெரிந்தால் நாற்கரத்தின் பரப்பளவு."}, {"n": 511, "c": 6, "t": "நேர்க்கோட்டின் சாய்வு (இரு புள்ளிகள்)", "e": "Slope of a Line (Two Points)", "f": "m = (y_2 - y_1) / (x_2 - x_1)  (x_1 ≠ x_2)", "d": "இரு புள்ளிகள் வழியே செல்லும் நேர்க்கோட்டின் சாய்வு."}, {"n": 512, "c": 6, "t": "நேர்க்கோட்டின் சாய்வு (சாய்வுக் கோணம்)", "e": "Slope from Angle of Inclination", "f": "m = tan θ", "d": "θ = X-அச்சின் மிகை திசையுடன் கோடு ஏற்படுத்தும் கோணம்."}, {"n": 513, "c": 6, "t": "கிடைமட்டக் கோட்டின் சாய்வு", "e": "Slope of a Horizontal Line", "f": "m = 0  (சமன்பாடு: y = k)", "d": "X-அச்சிற்கு இணையான கோட்டின் சாய்வு பூஜ்ஜியம்."}, {"n": 514, "c": 6, "t": "செங்குத்துக் கோட்டின் சாய்வு", "e": "Slope of a Vertical Line", "f": "m = வரையறுக்கப்படவில்லை (சமன்பாடு: x = h)", "d": "Y-அச்சிற்கு இணையான கோட்டின் சாய்வு."}, {"n": 515, "c": 6, "t": "இணை கோடுகளின் சாய்வு நிபந்தனை", "e": "Condition for Parallel Lines", "f": "m_1 = m_2", "d": "இரண்டு இணை கோடுகளின் சாய்வுகள் சமமாக இருக்கும்."}, {"n": 516, "c": 6, "t": "செங்குத்துக் கோடுகளின் சாய்வு நிபந்தனை", "e": "Condition for Perpendicular Lines", "f": "m_1 × m_2 = -1", "d": "இரண்டு செங்குத்துக் கோடுகளின் சாய்வுகளின் பெருக்கல் -1."}, {"n": 517, "c": 6, "t": "இரு கோடுகளுக்கு இடைப்பட்ட குறுங்கோணம்", "e": "Angle Between Two Lines", "f": "tan θ = |(m_1 - m_2) / (1 + m_1 m_2)|", "d": "m_1, m_2 சாய்வுகள் கொண்ட கோடுகளுக்கு இடைப்பட்ட கோணம்."}, {"n": 518, "c": 6, "t": "சாய்வு-வெட்டுத்துண்டு வடிவம்", "e": "Slope-Intercept Form of a Line", "f": "y = mx + c", "d": "m = சாய்வு, c = Y-வெட்டுத்துண்டு."}, {"n": 519, "c": 6, "t": "புள்ளி-சாய்வு வடிவம்", "e": "Point-Slope Form of a Line", "f": "y - y_1 = m(x - x_1)", "d": "(x_1, y_1) புள்ளி வழியே செல்லும் m சாய்வு கொண்ட கோடு."}, {"n": 520, "c": 6, "t": "இரு புள்ளி வடிவம்", "e": "Two-Point Form of a Line", "f": "(y - y_1) / (y_2 - y_1) = (x - x_1) / (x_2 - x_1)", "d": "இரு புள்ளிகள் வழியே செல்லும் நேர்க்கோட்டின் சமன்பாடு."}, {"n": 521, "c": 6, "t": "வெட்டுத்துண்டு வடிவம்", "e": "Intercept Form of a Line", "f": "(x / a) + (y / b) = 1", "d": "a = X-வெட்டுத்துண்டு, b = Y-வெட்டுத்துண்டு."}, {"n": 522, "c": 6, "t": "செங்குத்து வடிவம் (Normal Form)", "e": "Normal Form of a Line", "f": "x cos α + y sin α = p", "d": "p = ஆதிப்புள்ளியிலிருந்து செங்குத்து தூரம், α = செங்குத்துக் கோணம்."}, {"n": 523, "c": 6, "t": "நேர்க்கோட்டின் பொது வடிவம்", "e": "General Form of a Linear Equation", "f": "Ax + By + C = 0", "d": "இங்கு சாய்வு m = -A / B."}, {"n": 524, "c": 6, "t": "ஒரு புள்ளியிலிருந்து நேர்க்கோட்டிற்கு உள்ள செங்குத்து தூரம்", "e": "Distance from a Point to a Line", "f": "d = |Ax_1 + By_1 + C| / √(A^2 + B^2)", "d": "(x_1, y_1) புள்ளியிலிருந்து Ax + By + C = 0 கோட்டிற்கு உள்ள தூரம்."}, {"n": 525, "c": 6, "t": "இரண்டு இணை கோடுகளுக்கு இடைப்பட்ட தூரம்", "e": "Distance Between Two Parallel Lines", "f": "d = |C_1 - C_2| / √(A^2 + B^2)", "d": "Ax + By + C_1 = 0 மற்றும் Ax + By + C_2 = 0 கோடுகளுக்கு இடைப்பட்ட தூரம்."}, {"n": 526, "c": 6, "t": "இரு கோடுகளின் வெட்டுப்புள்ளி", "e": "Intersection of Two Lines", "f": "x = (b_1c_2 - b_2c_1)/(a_1b_2 - a_2b_1), y = (c_1a_2 - c_2a_1)/(a_1b_2 - a_2b_1)", "d": "இரண்டு வெட்டும் நேர்க்கோடுகள் சந்திக்கும் புள்ளி."}, {"n": 527, "c": 6, "t": "மூன்று கோடுகள் ஒரு புள்ளியில் சந்திக்கும் நிபந்தனை", "e": "Concurrency of Three Lines", "f": "det([[a_1, b_1, c_1], [a_2, b_2, c_2], [a_3, b_3, c_3]]) = 0", "d": "மூன்று நேர்க்கோடுகள் ஒரே புள்ளி வழியே செல்லும் நிபந்தனை."}, {"n": 528, "c": 6, "t": "கோண இருசமவெட்டிகளின் சமன்பாடு", "e": "Equations of Angle Bisectors", "f": "(a_1x + b_1y + c_1)/√(a_1^2 + b_1^2) = ±(a_2x + b_2y + c_2)/√(a_2^2 + b_2^2)", "d": "இரு வெட்டும் கோடுகளுக்கு இடைப்பட்ட கோண இருசமவெட்டிகள்."}, {"n": 529, "c": 6, "t": "இரட்டை நேர்க்கோடுகளின் பொதுச் சமன்பாடு", "e": "General Equation of Pair of Straight Lines", "f": "ax^2 + 2hxy + by^2 + 2gx + 2fy + c = 0", "d": "இரண்டாம் படி சமன்பாடு இரு நேர்க்கோடுகளைக் குறிக்கும் வடிவம்."}, {"n": 530, "c": 6, "t": "ஆதி வழிச் செல்லும் இரட்டை நேர்க்கோடுகள்", "e": "Homogeneous Equation of Pair of Lines", "f": "ax^2 + 2hxy + by^2 = 0", "d": "ஆதிப்புள்ளி வழியே செல்லும் இரு நேர்க்கோடுகளின் சமன்பாடு."}, {"n": 531, "c": 6, "t": "இரட்டை நேர்க்கோடுகளுக்கு இடைப்பட்ட கோணம்", "e": "Angle Between Pair of Straight Lines", "f": "tan θ = |[2√(h^2 - ab)] / (a + b)|", "d": "ax^2 + 2hxy + by^2 = 0 கோடுகளுக்கு இடைப்பட்ட கோணம்."}, {"n": 532, "c": 6, "t": "இரட்டை நேர்க்கோடுகள் செங்குத்தாக இருக்க நிபந்தனை", "e": "Perpendicularity of Pair of Lines", "f": "a + b = 0", "d": "x^2 மற்றும் y^2 கெழுக்களின் கூடுதல் பூஜ்ஜியமாக இருக்க வேண்டும்."}, {"n": 533, "c": 6, "t": "இரட்டை நேர்க்கோடுகள் இணையாக இருக்க நிபந்தனை", "e": "Parallelism of Pair of Lines", "f": "h^2 = ab", "d": "இரு கோடுகளும் இணையாக அல்லது ஒன்றின் மீது ஒன்றாக அமைய நிபந்தனை."}, {"n": 534, "c": 6, "t": "வட்டத்தின் திட்ட சமன்பாடு (மையம் (h, k))", "e": "Standard Equation of a Circle", "f": "(x - h)^2 + (y - k)^2 = r^2", "d": "மையம் (h, k) மற்றும் ஆரம் r கொண்ட வட்டம்."}, {"n": 535, "c": 6, "t": "ஆதியை மையமாகக் கொண்ட வட்டத்தின் சமன்பாடு", "e": "Circle Centered at Origin", "f": "x^2 + y^2 = r^2", "d": "மையம் (0, 0) மற்றும் ஆரம் r கொண்ட வட்டம்."}, {"n": 536, "c": 6, "t": "வட்டத்தின் பொதுச் சமன்பாடு", "e": "General Equation of a Circle", "f": "x^2 + y^2 + 2gx + 2fy + c = 0", "d": "வட்டத்தின் விரிவாக்கப்பட்ட பொது வடிவம்."}, {"n": 537, "c": 6, "t": "பொது வட்டத்தின் மையம் மற்றும் ஆரம்", "e": "Center and Radius of General Circle", "f": "மையம் = (-g, -f),  ஆரம் r = √(g^2 + f^2 - c)", "d": "x^2 + y^2 + 2gx + 2fy + c = 0 வட்டத்திற்கான சூத்திரம்."}, {"n": 538, "c": 6, "t": "விட்டத்தின் முனைப்புள்ளிகள் கொண்ட வட்டச் சமன்பாடு", "e": "Diameter Form of a Circle", "f": "(x - x_1)(x - x_2) + (y - y_1)(y - y_2) = 0", "d": "(x_1, y_1) மற்றும் (x_2, y_2) என்பவை விட்டத்தின் முனைகள்."}, {"n": 539, "c": 6, "t": "வட்டத்தின் துணையலகுச் சமன்பாடுகள்", "e": "Parametric Equations of a Circle", "f": "x = h + r cos θ,  y = k + r sin θ", "d": "θ = துணையலகு (Parameter)."}, {"n": 540, "c": 6, "t": "வட்டத்திற்கு (x_1, y_1) புள்ளியில் தொடுகோடு", "e": "Tangent to Circle at (x_1, y_1)", "f": "xx_1 + yy_1 + g(x + x_1) + f(y + y_1) + c = 0", "d": "வட்டத்தின் மீதுள்ள புள்ளியில் தொடுகோட்டின் சமன்பாடு."}, {"n": 541, "c": 6, "t": "வட்டத்திற்கு m சாய்வு கொண்ட தொடுகோடு", "e": "Tangent to Circle with Slope m", "f": "y = mx ± r√(1 + m^2)", "d": "x^2 + y^2 = r^2 வட்டத்தின் தொடுகோடு."}, {"n": 542, "c": 6, "t": "வெளிப்புள்ளி (x_1, y_1) இலிருந்து தொடுகோட்டின் நீளம்", "e": "Length of Tangent from External Point", "f": "L = √(x_1^2 + y_1^2 + 2gx_1 + 2fy_1 + c) = √S_1", "d": "வெளிப்புள்ளியிலிருந்து வட்டத்திற்கு வரையப்படும் தொடுகோட்டின் நீளம்."}, {"n": 543, "c": 6, "t": "இரு வட்டங்கள் செங்குத்தாக வெட்டும் நிபந்தனை", "e": "Orthogonality of Two Circles", "f": "2g_1g_2 + 2f_1f_2 = c_1 + c_2", "d": "இரு வட்டங்களின் தொடுகோடுகள் செங்கோணத்தில் வெட்டும் நிபந்தனை."}, {"n": 544, "c": 6, "t": "இரு வட்டங்களின் சமதொடுகோட்டு அச்சு (Radical Axis)", "e": "Radical Axis of Two Circles", "f": "S_1 - S_2 = 0 ⇒ 2(g_1 - g_2)x + 2(f_1 - f_2)y + (c_1 - c_2) = 0", "d": "இரு வட்டங்களுக்கும் சம நீளமுள்ள தொடுகோடுகள் கொண்ட புள்ளிகளின் நியமப்பாதை."}, {"n": 545, "c": 6, "t": "பரவளையத்தின் திட்ட சமன்பாடு (வலது திறப்பு)", "e": "Standard Parabola (Opens Right)", "f": "y^2 = 4ax", "d": "முனை (0,0), குவியம் (a,0), இயக்குவரை x = -a."}, {"n": 546, "c": 6, "t": "பரவளையத்தின் திட்ட சமன்பாடு (இடது திறப்பு)", "e": "Standard Parabola (Opens Left)", "f": "y^2 = -4ax", "d": "முனை (0,0), குவியம் (-a,0), இயக்குவரை x = a."}, {"n": 547, "c": 6, "t": "பரவளையத்தின் திட்ட சமன்பாடு (மேல் திறப்பு)", "e": "Standard Parabola (Opens Upward)", "f": "x^2 = 4ay", "d": "முனை (0,0), குவியம் (0,a), இயக்குவரை y = -a."}, {"n": 548, "c": 6, "t": "பரவளையத்தின் திட்ட சமன்பாடு (கீழ் திறப்பு)", "e": "Standard Parabola (Opens Downward)", "f": "x^2 = -4ay", "d": "முனை (0,0), குவியம் (0,-a), இயக்குவரை y = a."}, {"n": 549, "c": 6, "t": "பரவளையத்தின் செவ்வகல நீளம்", "e": "Length of Latus Rectum of Parabola", "f": "L = 4a", "d": "குவியம் வழியே அச்சிற்கு செங்குத்தாகச் செல்லும் நாணின் நீளம்."}, {"n": 550, "c": 6, "t": "பரவளையத்தின் துணையலகுச் சமன்பாடுகள்", "e": "Parametric Equations of Parabola (y^2 = 4ax)", "f": "x = at^2,  y = 2at", "d": "t = துணையலகு."}, {"n": 551, "c": 6, "t": "பரவளையத்திற்கு (x_1, y_1) புள்ளியில் தொடுகோடு", "e": "Tangent to Parabola at (x_1, y_1)", "f": "yy_1 = 2a(x + x_1)", "d": "y^2 = 4ax பரவளையத்தின் தொடுகோடு."}, {"n": 552, "c": 6, "t": "பரவளையத்திற்கு m சாய்வு கொண்ட தொடுகோடு", "e": "Tangent to Parabola with Slope m", "f": "y = mx + (a / m)", "d": "y^2 = 4ax பரவளையத்தின் தொடுகோடு."}, {"n": 553, "c": 6, "t": "பரவளையத்திற்கு செங்கோட்டின் சமன்பாடு (சாய்வு m)", "e": "Normal to Parabola with Slope m", "f": "y = mx - 2am - am^3", "d": "y^2 = 4ax பரவளையத்தின் செங்கோடு."}, {"n": 554, "c": 6, "t": "பரவளையத்தின் குவியத் தூரம்", "e": "Focal Distance of a Point on Parabola", "f": "PF = x_1 + a", "d": "y^2 = 4ax பரவளையத்தின் மீதுள்ள (x_1, y_1) புள்ளிக்கு குவியத் தூரம்."}, {"n": 555, "c": 6, "t": "நீள்வட்டத்தின் திட்ட சமன்பாடு (கிடைமட்ட நெட்டச்சு)", "e": "Standard Equation of Ellipse (Horizontal)", "f": "(x^2 / a^2) + (y^2 / b^2) = 1  (a > b)", "d": "மையம் (0,0), நெட்டச்சு 2a, குற்றச்சு 2b."}, {"n": 556, "c": 6, "t": "நீள்வட்டத்தின் திட்ட சமன்பாடு (செங்குத்து நெட்டச்சு)", "e": "Standard Equation of Ellipse (Vertical)", "f": "(x^2 / b^2) + (y^2 / a^2) = 1  (a > b)", "d": "Y-அச்சை நெட்டச்சாகக் கொண்ட நீள்வட்டம்."}, {"n": 557, "c": 6, "t": "நீள்வட்டத்தின் குவியத் தூரம் (c)", "e": "Focus Distance c in Ellipse", "f": "c^2 = a^2 - b^2  (குவியங்கள்: (±c, 0) அல்லது (±ae, 0))", "d": "மையத்திலிருந்து குவியத்திற்கு உள்ள தூரம்."}, {"n": 558, "c": 6, "t": "நீள்வட்டத்தின் மையத்தொலைத்தகவு", "e": "Eccentricity of an Ellipse", "f": "e = c / a = √(1 - b^2 / a^2)  (0 < e < 1)", "d": "நீள்வட்டத்தின் மையத்தொலைத்தகவு எப்போதும் 1-ஐ விடக் குறைவு."}, {"n": 559, "c": 6, "t": "நீள்வட்டத்தின் இயக்குவரைகள்", "e": "Directrices of an Ellipse", "f": "x = ±(a / e)", "d": "கிடைமட்ட நீள்வட்டத்தின் இரு இயக்குவரைகளின் சமன்பாடு."}, {"n": 560, "c": 6, "t": "நீள்வட்டத்தின் செவ்வகல நீளம்", "e": "Length of Latus Rectum of Ellipse", "f": "L = 2b^2 / a", "d": "குவியம் வழியே செல்லும் செங்குத்து நாணின் நீளம்."}, {"n": 561, "c": 6, "t": "நீள்வட்டத்தின் துணையலகுச் சமன்பாடுகள்", "e": "Parametric Equations of an Ellipse", "f": "x = a cos θ,  y = b sin θ", "d": "θ = மையக்கோணம் (Eccentric Angle)."}, {"n": 562, "c": 6, "t": "நீள்வட்டத்திற்கு (x_1, y_1) புள்ளியில் தொடுகோடு", "e": "Tangent to Ellipse at (x_1, y_1)", "f": "(xx_1 / a^2) + (yy_1 / b^2) = 1", "d": "நீள்வட்டத்தின் மீதுள்ள புள்ளியில் தொடுகோடு."}, {"n": 563, "c": 6, "t": "நீள்வட்டத்திற்கு m சாய்வு கொண்ட தொடுகோடு", "e": "Tangent to Ellipse with Slope m", "f": "y = mx ± √(a^2 m^2 + b^2)", "d": "m சாய்வு கொண்ட நீள்வட்டத் தொடுகோட்டின் சமன்பாடு."}, {"n": 564, "c": 6, "t": "நீள்வட்டத்தின் இயக்கு வட்டம் (Director Circle)", "e": "Director Circle of an Ellipse", "f": "x^2 + y^2 = a^2 + b^2", "d": "செங்குத்துத் தொடுகோடுகள் சந்திக்கும் புள்ளிகளின் நியமப்பாதை."}, {"n": 565, "c": 6, "t": "நீள்வட்டத்தின் குவியத் தூரங்களின் கூடுதல்", "e": "Sum of Focal Distances in Ellipse", "f": "PF_1 + PF_2 = 2a", "d": "நீள்வட்டத்தின் எந்தவொரு புள்ளியிலிருந்தும் இரு குவியங்களின் தூரக் கூடுதல்."}, {"n": 566, "c": 6, "t": "அதிபரவளையத்தின் திட்ட சமன்பாடு (கிடைமட்டம்)", "e": "Standard Equation of Hyperbola (Horizontal)", "f": "(x^2 / a^2) - (y^2 / b^2) = 1", "d": "குறுக்கச்சு 2a, துணை அச்சு 2b."}, {"n": 567, "c": 6, "t": "அதிபரவளையத்தின் திட்ட சமன்பாடு (செங்குத்து)", "e": "Standard Equation of Hyperbola (Vertical)", "f": "(y^2 / a^2) - (x^2 / b^2) = 1", "d": "Y-அச்சை குறுக்கச்சாகக் கொண்ட அதிபரவளையம்."}, {"n": 568, "c": 6, "t": "அதிபரவளையத்தின் குவியத் தூரம் (c)", "e": "Focus Distance c in Hyperbola", "f": "c^2 = a^2 + b^2  (குவியங்கள்: (±c, 0) அல்லது (±ae, 0))", "d": "மையத்திலிருந்து குவியத்திற்கு உள்ள தூரம்."}, {"n": 569, "c": 6, "t": "அதிபரவளையத்தின் மையத்தொலைத்தகவு", "e": "Eccentricity of a Hyperbola", "f": "e = c / a = √(1 + b^2 / a^2)  (e > 1)", "d": "அதிபரவளையத்தின் மையத்தொலைத்தகவு எப்போதும் 1-ஐ விட அதிகம்."}, {"n": 570, "c": 6, "t": "அதிபரவளையத்தின் இயக்குவரைகள்", "e": "Directrices of a Hyperbola", "f": "x = ±(a / e)", "d": "அதிபரவளையத்தின் இரு இயக்குவரைகளின் சமன்பாடு."}, {"n": 571, "c": 6, "t": "அதிபரவளையத்தின் செவ்வகல நீளம்", "e": "Length of Latus Rectum of Hyperbola", "f": "L = 2b^2 / a", "d": "அதிபரவளையத்தின் செவ்வகல நீளம்."}, {"n": 572, "c": 6, "t": "அதிபரவளையத்தின் தொலைத்தொடுகோடுகள்", "e": "Asymptotes of a Hyperbola", "f": "y = ±(b / a)x", "d": "முடிவிலியில் அதிபரவளையத்தைத் தொடும் நேர்க்கோடுகள்."}, {"n": 573, "c": 6, "t": "அதிபரவளையத்தின் துணையலகுச் சமன்பாடுகள்", "e": "Parametric Equations of a Hyperbola", "f": "x = a sec θ,  y = b tan θ", "d": "θ = துணையலகு."}, {"n": 574, "c": 6, "t": "அதிபரவளையத்திற்கு (x_1, y_1) புள்ளியில் தொடுகோடு", "e": "Tangent to Hyperbola at (x_1, y_1)", "f": "(xx_1 / a^2) - (yy_1 / b^2) = 1", "d": "அதிபரவளையத்தின் மீதுள்ள புள்ளியில் தொடுகோடு."}, {"n": 575, "c": 6, "t": "அதிபரவளையத்திற்கு m சாய்வு கொண்ட தொடுகோடு", "e": "Tangent to Hyperbola with Slope m", "f": "y = mx ± √(a^2 m^2 - b^2)", "d": "m சாய்வு கொண்ட அதிபரவளையத் தொடுகோடு."}, {"n": 576, "c": 6, "t": "செவ்வக அதிபரவளையம் (Rectangular Hyperbola)", "e": "Rectangular Hyperbola Equations", "f": "x^2 - y^2 = a^2  அல்லது  xy = c^2  (e = √2)", "d": "தொலைத்தொடுகோடுகள் செங்கோணத்தில் வெட்டும் அதிபரவளையம்."}, {"n": 577, "c": 6, "t": "அதிபரவளையத்தின் குவியத் தூரங்களின் வித்தியாசம்", "e": "Difference of Focal Distances in Hyperbola", "f": "|PF_1 - PF_2| = 2a", "d": "இரு குவியத் தூரங்களின் வித்தியாசம் மாறிலி (2a)."}, {"n": 578, "c": 6, "t": "கார்டீசியன் மற்றும் துருவ ஆள்கூறு மாற்றம் (x, y)", "e": "Polar to Cartesian Coordinates", "f": "x = r cos θ,  y = r sin θ", "d": "துருவ ஆள்கூறுகள் (r, θ)-லிருந்து கார்டீசியன் ஆள்கூறுகள் காணல்."}, {"n": 579, "c": 6, "t": "கார்டீசியனிலிருந்து துருவ ஆள்கூறு மாற்றம் (r, θ)", "e": "Cartesian to Polar Coordinates", "f": "r = √(x^2 + y^2),  θ = arctan(y / x)", "d": "கார்டீசியன் புள்ளி (x, y)-லிருந்து துருவ ஆள்கூறு காணல்."}, {"n": 580, "c": 6, "t": "துருவ ஆள்கூறுகளில் இரு புள்ளிகள் தூரம்", "e": "Distance Formula in Polar Coordinates", "f": "d = √[r_1^2 + r_2^2 - 2r_1r_2 cos(θ_1 - θ_2)]", "d": "(r_1, θ_1) மற்றும் (r_2, θ_2) புள்ளிகளுக்கு இடைப்பட்ட தூரம்."}, {"n": 581, "c": 6, "t": "துருவ வடிவில் வட்டத்தின் சமன்பாடு", "e": "Polar Equation of a Circle", "f": "r = 2a cos θ  அல்லது  r = 2a sin θ", "d": "ஆதிப்புள்ளி வழியே செல்லும் வட்டத்தின் துருவச் சமன்பாடு."}, {"n": 582, "c": 6, "t": "துருவ வடிவில் கூம்பு வெட்டுச் சமன்பாடு", "e": "Polar Equation of Conic Sections", "f": "r = (e × d) / (1 ± e cos θ)", "d": "குவியம் ஆதிப்புள்ளியில் உள்ள கூம்பு வெட்டுகளின் பொதுச் சமன்பாடு."}, {"n": 583, "c": 6, "t": "ஆய அச்சுகளின் இடப்பெயர்ச்சி (Translation of Axes)", "e": "Translation of Coordinate Axes", "f": "x = X + h,  y = Y + k", "d": "ஆதிப்புள்ளியை (h, k) புள்ளிக்கு மாற்றும்போது ஆள்கூறு மாற்றம்."}, {"n": 584, "c": 6, "t": "ஆய அச்சுகளின் சுழற்சி (Rotation of Axes)", "e": "Rotation of Coordinate Axes", "f": "x = X cos θ - Y sin θ,  y = X sin θ + Y cos θ", "d": "ஆய அச்சுகளை θ கோணத்தில் சுழற்றும்போது ஆள்கூறு மாற்றம்."}, {"n": 585, "c": 6, "t": "3D வெளியில் இரு புள்ளிகளுக்கு இடைப்பட்ட தூரம்", "e": "Distance Formula in 3D Space", "f": "d = √[(x_2 - x_1)^2 + (y_2 - y_1)^2 + (z_2 - z_1)^2]", "d": "முப்பரிமாண வெளியில் இரு புள்ளிகளுக்கு இடைப்பட்ட தூரம்."}, {"n": 586, "c": 6, "t": "3D வெளியில் நடுப்புள்ளி சூத்திரம்", "e": "Midpoint Formula in 3D Space", "f": "M = ((x_1 + x_2)/2, (y_1 + y_2)/2, (z_1 + z_2)/2)", "d": "3D கோட்டுத்துண்டின் நடுப்புள்ளி."}, {"n": 587, "c": 6, "t": "3D பிரிவு சூத்திரம் (உட்புறம்)", "e": "Section Formula in 3D (Internal)", "f": "P = ((mx_2+nx_1)/(m+n), (my_2+ny_1)/(m+n), (mz_2+nz_1)/(m+n))", "d": "3D கோட்டுத்துண்டை m : n விகிதத்தில் பிரிக்கும் புள்ளி."}, {"n": 588, "c": 6, "t": "நான்முகியின் திணிவு மையம் (Centroid of Tetrahedron)", "e": "Centroid of a Tetrahedron (3D)", "f": "G = ((x_1+x_2+x_3+x_4)/4, (y_1+y_2+y_3+y_4)/4, (z_1+z_2+z_3+z_4)/4)", "d": "நான்கு உச்சிகள் கொண்ட 3D நான்முகியின் திணிவு மையம்."}, {"n": 589, "c": 6, "t": "திசைக் கொசைன்கள் அடிப்படை விதி", "e": "Direction Cosines Identity", "f": "l^2 + m^2 + n^2 = 1  (cos^2 α + cos^2 β + cos^2 γ = 1)", "d": "3D கோட்டின் திசைக் கொசைன்களின் வர்க்கங்களின் கூடுதல் 1."}, {"n": 590, "c": 6, "t": "திசை விகிதங்களிலிருந்து திசைக் கொசைன்கள்", "e": "Direction Cosines from Direction Ratios", "f": "l = ±a/√(a^2+b^2+c^2), m = ±b/√(a^2+b^2+c^2), n = ±c/√(a^2+b^2+c^2)", "d": "a, b, c என்பவை திசை விகிதங்கள்."}, {"n": 591, "c": 6, "t": "3D இரு கோடுகளுக்கு இடைப்பட்ட கோணம்", "e": "Angle Between Two Lines in 3D", "f": "cos θ = |l_1l_2 + m_1m_2 + n_1n_2|", "d": "திசைக் கொசைன்கள் கொண்ட இரு 3D கோடுகளின் கோணம்."}, {"n": 592, "c": 6, "t": "3D நேர்க்கோட்டின் சமச்சீர் வடிவம்", "e": "Symmetric Form of a Line in 3D", "f": "(x - x_1) / a = (y - y_1) / b = (z - z_1) / c", "d": "(x_1, y_1, z_1) வழிச் சென்று (a, b, c) திசை விகிதங்கள் கொண்ட கோடு."}, {"n": 593, "c": 6, "t": "3D நேர்க்கோட்டின் வெக்டர் வடிவம்", "e": "Vector Equation of a Line in 3D", "f": "r⃗ = a⃗ + λb⃗", "d": "a⃗ = நிலை வெக்டர், b⃗ = இணை வெக்டர்."}, {"n": 594, "c": 6, "t": "3D ஒரு தளம் அமையா கோடுகளுக்கு இடைப்பட்ட தூரம்", "e": "Shortest Distance Between Skew Lines", "f": "d = |[ (a⃗_2 - a⃗_1) · (b⃗_1 × b⃗_2) ]| / |b⃗_1 × b⃗_2|", "d": "வெட்டாத மற்றும் இணையில்லாத இரு 3D கோடுகளின் குறைந்தபட்ச தூரம்."}, {"n": 595, "c": 6, "t": "தளத்தின் பொதுச் சமன்பாடு (3D)", "e": "General Equation of a Plane in 3D", "f": "Ax + By + Cz + D = 0", "d": "(A, B, C) என்பது தளத்திற்குச் செங்குத்தான திசை விகிதங்கள்."}, {"n": 596, "c": 6, "t": "தளத்தின் வெட்டுத்துண்டு வடிவம்", "e": "Intercept Form of a Plane", "f": "(x / a) + (y / b) + (z / c) = 1", "d": "a, b, c என்பவை X, Y, Z அச்சு வெட்டுத்துண்டுகள்."}, {"n": 597, "c": 6, "t": "தளத்தின் செங்குத்து வடிவம்", "e": "Normal Form of a Plane", "f": "lx + my + nz = p", "d": "p = ஆதியிலிருந்து தளத்திற்கு உள்ள செங்குத்து தூரம்."}, {"n": 598, "c": 6, "t": "ஒரு புள்ளியிலிருந்து தளத்திற்கு உள்ள தூரம்", "e": "Distance from a Point to a Plane", "f": "d = |Ax_1 + By_1 + Cz_1 + D| / √(A^2 + B^2 + C^2)", "d": "(x_1, y_1, z_1) புள்ளியிலிருந்து தளத்திற்கு உள்ள செங்குத்து தூரம்."}, {"n": 599, "c": 6, "t": "இரு தளங்களுக்கு இடைப்பட்ட கோணம்", "e": "Angle Between Two Planes", "f": "cos θ = |A_1A_2 + B_1B_2 + C_1C_2| / [√(A_1^2+B_1^2+C_1^2)√(A_2^2+B_2^2+C_2^2)]", "d": "இரு தளங்களின் செங்குத்து வெக்டர்களுக்கு இடைப்பட்ட கோணம்."}, {"n": 600, "c": 6, "t": "3D கோளத்தின் பொதுச் சமன்பாடு", "e": "General Equation of a Sphere in 3D", "f": "(x - h)^2 + (y - k)^2 + (z - l)^2 = r^2", "d": "மையம் (h, k, l) மற்றும் ஆரம் r கொண்ட முப்பரிமாணக் கோளம்."}]}, {"id": 7, "name": "Differential Calculus Formulas", "f": [{"n": 601, "c": 7, "t": "வகைக்கெழுவின் முதல் கொள்கை வரையறை", "e": "Definition of Derivative (First Principle)", "f": "f'(x) = lim_(h→0) [f(x + h) - f(x)] / h", "d": "சார்பு f(x)-ன் மாறுவீதத்தைக் காணும் அடிப்படை வரையறை."}, {"n": 602, "c": 7, "t": "மாறிலியின் வகைக்கெழு", "e": "Derivative of a Constant", "f": "d/dx (c) = 0", "d": "c என்பது ஒரு மாறிலி; மாறிலியின் வகைக்கெழு பூஜ்ஜியம் ஆகும்."}, {"n": 603, "c": 7, "t": "x-ன் வகைக்கெழு", "e": "Derivative of x", "f": "d/dx (x) = 1", "d": "x-ஐ x பொறுத்து வகைப்படுத்தினால் விடை 1 கிடைக்கும்."}, {"n": 604, "c": 7, "t": "அடுக்கு விதி (Power Rule)", "e": "Power Rule of Differentiation", "f": "d/dx (x^n) = n × x^(n - 1)", "d": "n ஒரு மெய் எண்; அடுக்கை முன்னால் கொண்டு வந்து அடுக்கில் 1-ஐ கழிக்க வேண்டும்."}, {"n": 605, "c": 7, "t": "மாறிலிப் பெருக்கல் விதி", "e": "Constant Multiple Rule", "f": "d/dx [c × f(x)] = c × f'(x)", "d": "மாறிலியை வெளியே எடுத்துவிட்டுச் சார்பை மட்டும் வகைப்படுத்த வேண்டும்."}, {"n": 606, "c": 7, "t": "கூட்டல் விதி", "e": "Sum Rule of Differentiation", "f": "d/dx [f(x) + g(x)] = f'(x) + g'(x)", "d": "இரு சார்புகளின் கூடுதலின் வகைக்கெழு தனித்தனி வகைக்கெழுக்களின் கூடுதலுக்குச் சமம்."}, {"n": 607, "c": 7, "t": "கழித்தல் விதி", "e": "Difference Rule of Differentiation", "f": "d/dx [f(x) - g(x)] = f'(x) - g'(x)", "d": "இரு சார்புகளின் வித்தியாசத்தின் வகைக்கெழு தனித்தனி வகைக்கெழுக்களின் வித்தியாசத்திற்குச் சமம்."}, {"n": 608, "c": 7, "t": "பெருக்கல் விதி (Product Rule)", "e": "Product Rule (Leibniz Rule)", "f": "d/dx [u × v] = u(dv/dx) + v(du/dx)", "d": "இரண்டு சார்புகளின் பெருக்கற்பலனை வகைப்படுத்தும் சூத்திரம்."}, {"n": 609, "c": 7, "t": "மூன்று சார்புகளின் பெருக்கல் விதி", "e": "Product Rule for Three Functions", "f": "d/dx (uvw) = u'vw + uv'w + uvw'", "d": "மூன்று சார்புகளின் பெருக்கலை வகைப்படுத்தும் சூத்திரம்."}, {"n": 610, "c": 7, "t": "வகுத்தல் விதி (Quotient Rule)", "e": "Quotient Rule of Differentiation", "f": "d/dx (u / v) = [v(du/dx) - u(dv/dx)] / v^2  (v ≠ 0)", "d": "இரண்டு சார்புகளின் வகுத்தலை வகைப்படுத்தும் சூத்திரம்."}, {"n": 611, "c": 7, "t": "சங்கிலி விதி (Chain Rule)", "e": "Chain Rule of Differentiation", "f": "dy/dx = (dy/du) × (du/dx)  அல்லது  d/dx[f(g(x))] = f'(g(x)) × g'(x)", "d": "சார்புகளின் சேர்ப்பை (Composite Function) வகைப்படுத்தும் விதி."}, {"n": 612, "c": 7, "t": "நேர்மாறு சார்பின் வகைக்கெழு", "e": "Derivative of an Inverse Function", "f": "(f^(-1))'(x) = 1 / f'(f^(-1)(x))  அல்லது  dx/dy = 1 / (dy/dx)", "d": "நேர்மாறு சார்பின் வகைக்கெழு காணும் சூத்திரம்."}, {"n": 613, "c": 7, "t": "வர்க்கமூலத்தின் வகைக்கெழு", "e": "Derivative of Square Root", "f": "d/dx (√x) = 1 / (2√x)", "d": "x^(1/2) அடுக்கு விதியிலிருந்து பெறப்படும் முக்கியச் சூத்திரம்."}, {"n": 614, "c": 7, "t": "தலைகீழியின் வகைக்கெழு (1/x)", "e": "Derivative of Reciprocal (1/x)", "f": "d/dx (1/x) = -1 / x^2", "d": "1/x சார்பின் வகைக்கெழு."}, {"n": 615, "c": 7, "t": "1/x^n வகைக்கெழு", "e": "Derivative of 1/x^n", "f": "d/dx (1/x^n) = -n / x^(n + 1)", "d": "x^(-n) வடிவச் சார்பின் வகைக்கெழு."}, {"n": 616, "c": 7, "t": "இயல் அடுக்குக்குறிச் சார்பின் வகைக்கெழு", "e": "Derivative of Natural Exponential (e^x)", "f": "d/dx (e^x) = e^x", "d": "e^x சார்பின் வகைக்கெழு அதே சார்பாக இருக்கும்."}, {"n": 617, "c": 7, "t": "e^(kx) சார்பின் வகைக்கெழு", "e": "Derivative of e^(kx)", "f": "d/dx (e^(kx)) = k × e^(kx)", "d": "k ஒரு மாறிலி; சங்கிலி விதிப்படி k முன்னால் வரும்."}, {"n": 618, "c": 7, "t": "பொது அடுக்குக்குறிச் சார்பின் வகைக்கெழு (a^x)", "e": "Derivative of Exponential Function (a^x)", "f": "d/dx (a^x) = a^x × ln(a)  (a > 0)", "d": "a அடிமானம் கொண்ட அடுக்குக்குறிச் சார்பின் வகைக்கெழு."}, {"n": 619, "c": 7, "t": "இயல் மடக்கைச் சார்பின் வகைக்கெழு", "e": "Derivative of Natural Logarithm (ln x)", "f": "d/dx (ln x) = 1 / x  (x > 0)", "d": "இயல் மடக்கையின் வகைக்கெழு 1/x ஆகும்."}, {"n": 620, "c": 7, "t": "தனிமதிப்பு மடக்கையின் வகைக்கெழு", "e": "Derivative of ln|x|", "f": "d/dx (ln|x|) = 1 / x  (x ≠ 0)", "d": "பூஜ்ஜியமற்ற அனைத்து மெய் எண்களுக்கும் பொருந்தும் மடக்கை வகைக்கெழு."}, {"n": 621, "c": 7, "t": "பொது மடக்கைச் சார்பின் வகைக்கெழு (log_a x)", "e": "Derivative of General Logarithm (log_a x)", "f": "d/dx (log_a x) = 1 / (x × ln a)", "d": "a அடிமானம் கொண்ட மடக்கையின் வகைக்கெழு."}, {"n": 622, "c": 7, "t": "சார்பின் அடுக்குச் சார்பு வகைக்கெழு (x^x)", "e": "Derivative of x^x", "f": "d/dx (x^x) = x^x (1 + ln x)", "d": "மடக்கை வகைப்படுத்தல் மூலம் பெறப்படும் சூத்திரம்."}, {"n": 623, "c": 7, "t": "u^v வடிவச் சார்பின் வகைக்கெழு", "e": "Logarithmic Differentiation (u^v)", "f": "d/dx (u^v) = u^v [ (v/u)(du/dx) + ln(u)(dv/dx) ]", "d": "அடிமானமும் அடுக்கும் மாறிகளாக இருக்கும்போது பயன்படும் சூத்திரம்."}, {"n": 624, "c": 7, "t": "sin x வகைக்கெழு", "e": "Derivative of sin x", "f": "d/dx (sin x) = cos x", "d": "சைன் சார்பின் வகைக்கெழு கொசைன் ஆகும்."}, {"n": 625, "c": 7, "t": "cos x வகைக்கெழு", "e": "Derivative of cos x", "f": "d/dx (cos x) = -sin x", "d": "கொசைன் சார்பின் வகைக்கெழு எதிர் சைன் ஆகும்."}, {"n": 626, "c": 7, "t": "tan x வகைக்கெழு", "e": "Derivative of tan x", "f": "d/dx (tan x) = sec^2(x)", "d": "டேன்ஜென்ட் சார்பின் வகைக்கெழு sec²x ஆகும்."}, {"n": 627, "c": 7, "t": "cot x வகைக்கெழு", "e": "Derivative of cot x", "f": "d/dx (cot x) = -csc^2(x)", "d": "கோடேன்ஜென்ட் சார்பின் வகைக்கெழு -csc²x ஆகும்."}, {"n": 628, "c": 7, "t": "sec x வகைக்கெழு", "e": "Derivative of sec x", "f": "d/dx (sec x) = sec x × tan x", "d": "சீக்கன்ட் சார்பின் வகைக்கெழு."}, {"n": 629, "c": 7, "t": "csc x வகைக்கெழு", "e": "Derivative of csc x", "f": "d/dx (csc x) = -csc x × cot x", "d": "கொசீக்கன்ட் சார்பின் வகைக்கெழு."}, {"n": 630, "c": 7, "t": "sin(kx) வகைக்கெழு", "e": "Derivative of sin(kx)", "f": "d/dx [sin(kx)] = k cos(kx)", "d": "k ஒரு மாறிலி."}, {"n": 631, "c": 7, "t": "cos(kx) வகைக்கெழு", "e": "Derivative of cos(kx)", "f": "d/dx [cos(kx)] = -k sin(kx)", "d": "k ஒரு மாறிலி."}, {"n": 632, "c": 7, "t": "tan(kx) வகைக்கெழு", "e": "Derivative of tan(kx)", "f": "d/dx [tan(kx)] = k sec^2(kx)", "d": "k ஒரு மாறிலி."}, {"n": 633, "c": 7, "t": "arcsin x வகைக்கெழு", "e": "Derivative of Inverse Sine (arcsin x)", "f": "d/dx (arcsin x) = 1 / √(1 - x^2)  (-1 < x < 1)", "d": "நேர்மாறு சைன் சார்பின் வகைக்கெழு."}, {"n": 634, "c": 7, "t": "arccos x வகைக்கெழு", "e": "Derivative of Inverse Cosine (arccos x)", "f": "d/dx (arccos x) = -1 / √(1 - x^2)  (-1 < x < 1)", "d": "நேர்மாறு கொசைன் சார்பின் வகைக்கெழு."}, {"n": 635, "c": 7, "t": "arctan x வகைக்கெழு", "e": "Derivative of Inverse Tangent (arctan x)", "f": "d/dx (arctan x) = 1 / (1 + x^2)", "d": "நேர்மாறு டேன்ஜென்ட் சார்பின் வகைக்கெழு."}, {"n": 636, "c": 7, "t": "arccot x வகைக்கெழு", "e": "Derivative of Inverse Cotangent (arccot x)", "f": "d/dx (arccot x) = -1 / (1 + x^2)", "d": "நேர்மாறு கோடேன்ஜென்ட் சார்பின் வகைக்கெழு."}, {"n": 637, "c": 7, "t": "arcsec x வகைக்கெழு", "e": "Derivative of Inverse Secant (arcsec x)", "f": "d/dx (arcsec x) = 1 / [|x|√(x^2 - 1)]  (|x| > 1)", "d": "நேர்மாறு சீக்கன்ட் சார்பின் வகைக்கெழு."}, {"n": 638, "c": 7, "t": "arccsc x வகைக்கெழு", "e": "Derivative of Inverse Cosecant (arccsc x)", "f": "d/dx (arccsc x) = -1 / [|x|√(x^2 - 1)]  (|x| > 1)", "d": "நேர்மாறு கொசீக்கன்ட் சார்பின் வகைக்கெழு."}, {"n": 639, "c": 7, "t": "sinh x வகைக்கெழு", "e": "Derivative of Hyperbolic Sine (sinh x)", "f": "d/dx (sinh x) = cosh x", "d": "அதிபரவளைய சைன் சார்பின் வகைக்கெழு."}, {"n": 640, "c": 7, "t": "cosh x வகைக்கெழு", "e": "Derivative of Hyperbolic Cosine (cosh x)", "f": "d/dx (cosh x) = sinh x", "d": "அதிபரவளைய கொசைன் சார்பின் வகைக்கெழு (குறி மாறாது)."}, {"n": 641, "c": 7, "t": "tanh x வகைக்கெழு", "e": "Derivative of Hyperbolic Tangent (tanh x)", "f": "d/dx (tanh x) = sech^2(x)", "d": "அதிபரவளைய டேன்ஜென்ட் சார்பின் வகைக்கெழு."}, {"n": 642, "c": 7, "t": "coth x வகைக்கெழு", "e": "Derivative of Hyperbolic Cotangent (coth x)", "f": "d/dx (coth x) = -csch^2(x)", "d": "அதிபரவளைய கோடேன்ஜென்ட் சார்பின் வகைக்கெழு."}, {"n": 643, "c": 7, "t": "sech x வகைக்கெழு", "e": "Derivative of Hyperbolic Secant (sech x)", "f": "d/dx (sech x) = -sech x × tanh x", "d": "அதிபரவளைய சீக்கன்ட் சார்பின் வகைக்கெழு."}, {"n": 644, "c": 7, "t": "csch x வகைக்கெழு", "e": "Derivative of Hyperbolic Cosecant (csch x)", "f": "d/dx (csch x) = -csch x × coth x", "d": "அதிபரவளைய கொசீக்கன்ட் சார்பின் வகைக்கெழு."}, {"n": 645, "c": 7, "t": "arsinh x வகைக்கெழு", "e": "Derivative of Inverse Hyperbolic Sine", "f": "d/dx (arsinh x) = 1 / √(x^2 + 1)", "d": "நேர்மாறு அதிபரவளைய சைன் சார்பின் வகைக்கெழு."}, {"n": 646, "c": 7, "t": "arcosh x வகைக்கெழு", "e": "Derivative of Inverse Hyperbolic Cosine", "f": "d/dx (arcosh x) = 1 / √(x^2 - 1)  (x > 1)", "d": "நேர்மாறு அதிபரவளைய கொசைன் சார்பின் வகைக்கெழு."}, {"n": 647, "c": 7, "t": "artanh x வகைக்கெழு", "e": "Derivative of Inverse Hyperbolic Tangent", "f": "d/dx (artanh x) = 1 / (1 - x^2)  (|x| < 1)", "d": "நேர்மாறு அதிபரவளைய டேன்ஜென்ட் சார்பின் வகைக்கெழு."}, {"n": 648, "c": 7, "t": "arcoth x வகைக்கெழு", "e": "Derivative of Inverse Hyperbolic Cotangent", "f": "d/dx (arcoth x) = 1 / (1 - x^2)  (|x| > 1)", "d": "நேர்மாறு அதிபரவளைய கோடேன்ஜென்ட் சார்பின் வகைக்கெழு."}, {"n": 649, "c": 7, "t": "arsech x வகைக்கெழு", "e": "Derivative of Inverse Hyperbolic Secant", "f": "d/dx (arsech x) = -1 / [x√(1 - x^2)]  (0 < x < 1)", "d": "நேர்மாறு அதிபரவளைய சீக்கன்ட் சார்பின் வகைக்கெழு."}, {"n": 650, "c": 7, "t": "arcsch x வகைக்கெழு", "e": "Derivative of Inverse Hyperbolic Cosecant", "f": "d/dx (arcsch x) = -1 / [|x|√(1 + x^2)]  (x ≠ 0)", "d": "நேர்மாறு அதிபரவளைய கொசீக்கன்ட் சார்பின் வகைக்கெழு."}, {"n": 651, "c": 7, "t": "தனிமதிப்புச் சார்பின் வகைக்கெழு", "e": "Derivative of Absolute Value Function", "f": "d/dx (|x|) = x / |x| = sgn(x)  (x ≠ 0)", "d": "x = 0 புள்ளியில் |x| வகைப்படுத்தத்தக்கது அல்ல."}, {"n": 652, "c": 7, "t": "உட்படு சார்பு வகைப்படுத்தல் (Implicit)", "e": "Implicit Differentiation Formula", "f": "dy/dx = - (∂F / ∂x) / (∂F / ∂y)", "d": "F(x, y) = 0 என்ற சமன்பாட்டிலிருந்து dy/dx காணும் சூத்திரம்."}, {"n": 653, "c": 7, "t": "துணையலகுச் சார்பின் முதல் வகைக்கெழு", "e": "Parametric First Derivative", "f": "dy/dx = (dy/dt) / (dx/dt)  (dx/dt ≠ 0)", "d": "x = f(t), y = g(t) எனில் dy/dx காணும் சூத்திரம்."}, {"n": 654, "c": 7, "t": "துணையலகுச் சார்பின் இரண்டாம் வகைக்கெழு", "e": "Parametric Second Derivative", "f": "d^2y/dx^2 = [d/dt (dy/dx)] / (dx/dt)", "d": "துணையலகுச் சமன்பாடுகளின் இரண்டாம் வரிசை வகைக்கெழு."}, {"n": 655, "c": 7, "t": "துருவ வளைவரையின் சாய்வு", "e": "Slope of a Polar Curve r = f(θ)", "f": "dy/dx = [(dr/dθ)sin θ + r cos θ] / [(dr/dθ)cos θ - r sin θ]", "d": "துருவச் சமன்பாடு r = f(θ)-க்கு கார்டீசியன் சாய்வு."}, {"n": 656, "c": 7, "t": "x^n சார்பின் n-ஆம் வகைக்கெழு", "e": "nth Derivative of x^n", "f": "d^n/dx^n (x^n) = n!", "d": "n-ஆம் படி பல்லுறுப்புக்கோவையின் n-ஆம் வகைக்கெழு."}, {"n": 657, "c": 7, "t": "(ax + b)^m சார்பின் n-ஆம் வகைக்கெழு", "e": "nth Derivative of (ax + b)^m", "f": "y_n = [m! / (m - n)!] × a^n × (ax + b)^(m - n)", "d": "m ≥ n எனும்போது உயர் வரிசை வகைக்கெழு."}, {"n": 658, "c": 7, "t": "1 / (ax + b) சார்பின் n-ஆம் வகைக்கெழு", "e": "nth Derivative of 1 / (ax + b)", "f": "y_n = [(-1)^n × n! × a^n] / (ax + b)^(n + 1)", "d": "விகிதமுறு சார்பின் n-ஆம் வரிசை வகைக்கெழு."}, {"n": 659, "c": 7, "t": "e^(ax) சார்பின் n-ஆம் வகைக்கெழு", "e": "nth Derivative of e^(ax)", "f": "d^n/dx^n (e^(ax)) = a^n × e^(ax)", "d": "அடுக்குக்குறிச் சார்பின் n-ஆம் வரிசை வகைக்கெழு."}, {"n": 660, "c": 7, "t": "a^x சார்பின் n-ஆம் வகைக்கெழு", "e": "nth Derivative of a^x", "f": "d^n/dx^n (a^x) = a^x × (ln a)^n", "d": "பொது அடுக்குக்குறிச் சார்பின் n-ஆம் வகைக்கெழு."}, {"n": 661, "c": 7, "t": "ln(ax + b) சார்பின் n-ஆம் வகைக்கெழு", "e": "nth Derivative of ln(ax + b)", "f": "y_n = [(-1)^(n - 1) × (n - 1)! × a^n] / (ax + b)^n", "d": "மடக்கைச் சார்பின் n-ஆம் வரிசை வகைக்கெழு."}, {"n": 662, "c": 7, "t": "sin(ax + b) சார்பின் n-ஆம் வகைக்கெழு", "e": "nth Derivative of sin(ax + b)", "f": "y_n = a^n × sin(ax + b + nπ/2)", "d": "சைன் சார்பின் n-ஆம் வரிசை வகைக்கெழு."}, {"n": 663, "c": 7, "t": "cos(ax + b) சார்பின் n-ஆம் வகைக்கெழு", "e": "nth Derivative of cos(ax + b)", "f": "y_n = a^n × cos(ax + b + nπ/2)", "d": "கொசைன் சார்பின் n-ஆம் வரிசை வகைக்கெழு."}, {"n": 664, "c": 7, "t": "லீப்னிட்ஸ் தேற்றம் (n-ஆம் வகைக்கெழு பெருக்கல்)", "e": "Leibniz's Rule for nth Derivative", "f": "(uv)_n = Σ [nCr × u_(n - r) × v_r]  (r = 0 to n)", "d": "இரு சார்புகளின் பெருக்கலின் n-ஆம் வகைக்கெழு காணும் தேற்றம்."}, {"n": 665, "c": 7, "t": "அடிப்படை எல்லை விதி (sin x / x)", "e": "Standard Trigonometric Limit", "f": "lim_(x→0) (sin x / x) = 1  (x ரேடியன்களில்)", "d": "நுண்கணிதத்தின் மிக முக்கியமான எல்லை மதிப்பு."}, {"n": 666, "c": 7, "t": "டேன்ஜென்ட் எல்லை விதி (tan x / x)", "e": "Standard Tangent Limit", "f": "lim_(x→0) (tan x / x) = 1", "d": "x பூஜ்ஜியத்தை நெருங்கும்போது tan x / x எல்லை."}, {"n": 667, "c": 7, "t": "கொசைன் எல்லை விதி ((1 - cos x) / x)", "e": "Standard Cosine Limit", "f": "lim_(x→0) [(1 - cos x) / x] = 0", "d": "x பூஜ்ஜியத்தை நெருங்கும்போது (1 - cos x)/x எல்லை."}, {"n": 668, "c": 7, "t": "அடுக்கு எல்லை விதி ((x^n - a^n) / (x - a))", "e": "Algebraic Power Limit", "f": "lim_(x→a) [(x^n - a^n) / (x - a)] = n × a^(n - 1)", "d": "இயற்கணித எல்லைகளைத் தீர்க்கப் பயன்படும் சூத்திரம்."}, {"n": 669, "c": 7, "t": "இயல் எண் e எல்லை வரையறை 1", "e": "Limit Definition of Euler's Number e (1)", "f": "lim_(n→∞) (1 + 1/n)^n = e", "d": "கணித மாறிலி e-ன் எல்லை வரையறை."}, {"n": 670, "c": 7, "t": "இயல் எண் e எல்லை வரையறை 2", "e": "Limit Definition of Euler's Number e (2)", "f": "lim_(x→0) (1 + x)^(1/x) = e", "d": "0-ஐ நெருங்கும் எல்லை வடிவில் e வரையறை."}, {"n": 671, "c": 7, "t": "அடுக்குக்குறி எல்லை விதி ((e^x - 1) / x)", "e": "Exponential Limit Formula", "f": "lim_(x→0) [(e^x - 1) / x] = 1", "d": "அடுக்குக்குறிச் சார்பின் அடிப்படை எல்லை."}, {"n": 672, "c": 7, "t": "பொது அடுக்கு எல்லை விதி ((a^x - 1) / x)", "e": "General Exponential Limit", "f": "lim_(x→0) [(a^x - 1) / x] = ln(a)", "d": "a அடிமான அடுக்குக்குறி எல்லை."}, {"n": 673, "c": 7, "t": "மடக்கை எல்லை விதி (ln(1 + x) / x)", "e": "Logarithmic Limit Formula", "f": "lim_(x→0) [ln(1 + x) / x] = 1", "d": "இயல் மடக்கையின் அடிப்படை எல்லை."}, {"n": 674, "c": 7, "t": "எல்-ஹாஸ்பிடல் விதி (L'Hôpital's Rule)", "e": "L'Hôpital's Rule for Indeterminate Forms", "f": "lim_(x→c) [f(x) / g(x)] = lim_(x→c) [f'(x) / g'(x)]", "d": "0/0 அல்லது ∞/∞ தேறப்பெறா வடிவங்களின் எல்லையைக் காணும் விதி."}, {"n": 675, "c": 7, "t": "ரோலின் தேற்றம் (Rolle's Theorem)", "e": "Rolle's Theorem Condition", "f": "f(a) = f(b) எனில், f'(c) = 0 ஆகுமாறு c ∈ (a, b) உண்டு", "d": "மூடிய இடைவெளியில் தொடர்ச்சியான மற்றும் வகைப்படுத்தத்தக்க சார்புக்கான தேற்றம்."}, {"n": 676, "c": 7, "t": "லெக்ராஞ்சியின் சராசரி மதிப்புத் தேற்றம் (MVT)", "e": "Lagrange's Mean Value Theorem", "f": "f'(c) = [f(b) - f(a)] / (b - a)  (c ∈ (a, b))", "d": "சராசரி மாறுவீதமும் உடனடி மாறுவீதமும் சமமாகும் புள்ளி c உண்டு."}, {"n": 677, "c": 7, "t": "கௌச்சியின் சராசரி மதிப்புத் தேற்றம்", "e": "Cauchy's Mean Value Theorem", "f": "f'(c) / g'(c) = [f(b) - f(a)] / [g(b) - g(a)]", "d": "இரண்டு சார்புகளுக்கான பொதுவான சராசரி மதிப்புத் தேற்றம்."}, {"n": 678, "c": 7, "t": "டெய்லர் தொடர் விரிவாக்கம் (Taylor Series)", "e": "Taylor Series Expansion at x = a", "f": "f(x) = Σ [f^(n)(a) / n!] × (x - a)^n  (n = 0 to ∞)", "d": "ஒரு சார்பை a புள்ளியைச் சுற்றி அடுக்குத் தொடராக விரிவுபடுத்தல்."}, {"n": 679, "c": 7, "t": "மெக்லாரின் தொடர் விரிவாக்கம் (Maclaurin Series)", "e": "Maclaurin Series Expansion at x = 0", "f": "f(x) = f(0) + f'(0)x + [f''(0)/2!]x^2 + [f'''(0)/3!]x^3 + ...", "d": "x = 0 புள்ளியைச் சுற்றிய டெய்லர் தொடர் விரிவாக்கம்."}, {"n": 680, "c": 7, "t": "e^x மெக்லாரின் தொடர்", "e": "Maclaurin Series for e^x", "f": "e^x = 1 + x + x^2/2! + x^3/3! + x^4/4! + ...", "d": "அனைத்து மெய் எண்களுக்கும் ஒருங்கும் e^x தொடர்."}, {"n": 681, "c": 7, "t": "sin x மெக்லாரின் தொடர்", "e": "Maclaurin Series for sin x", "f": "sin x = x - x^3/3! + x^5/5! - x^7/7! + ...", "d": "சைன் சார்பின் அடுக்குத் தொடர் விரிவாக்கம்."}, {"n": 682, "c": 7, "t": "cos x மெக்லாரின் தொடர்", "e": "Maclaurin Series for cos x", "f": "cos x = 1 - x^2/2! + x^4/4! - x^6/6! + ...", "d": "கொசைன் சார்பின் அடுக்குத் தொடர் விரிவாக்கம்."}, {"n": 683, "c": 7, "t": "ln(1 + x) மெக்லாரின் தொடர்", "e": "Maclaurin Series for ln(1 + x)", "f": "ln(1 + x) = x - x^2/2 + x^3/3 - x^4/4 + ...  (-1 < x ≤ 1)", "d": "இயல் மடக்கையின் அடுக்குத் தொடர் விரிவாக்கம்."}, {"n": 684, "c": 7, "t": "(1 + x)^n ஈருறுப்புத் தொடர் (பொது அடுக்கு)", "e": "General Binomial Series", "f": "(1 + x)^n = 1 + nx + [n(n-1)/2!]x^2 + [n(n-1)(n-2)/3!]x^3 + ... (|x|<1)", "d": "பின்ன மற்றும் எதிர் அடுக்குகளுக்கான விரிவாக்கம்."}, {"n": 685, "c": 7, "t": "வளைவரையின் தொடுகோட்டுச் சமன்பாடு", "e": "Equation of Tangent Line at (x_1, y_1)", "f": "y - y_1 = f'(x_1)(x - x_1)", "d": "(x_1, y_1) புள்ளியில் தொடுகோட்டின் சாய்வு m = f'(x_1)."}, {"n": 686, "c": 7, "t": "வளைவரையின் செங்கோட்டுச் சமன்பாடு", "e": "Equation of Normal Line at (x_1, y_1)", "f": "y - y_1 = [-1 / f'(x_1)](x - x_1)", "d": "தொடுகோட்டிற்குச் செங்குத்தான கோட்டின் சமன்பாடு."}, {"n": 687, "c": 7, "t": "துணைத் தொடுகோட்டின் நீளம் (Subtangent)", "e": "Length of Subtangent", "f": "Subtangent = |y_1 / (dy/dx)|", "d": "தொடுகோட்டின் X-அச்சு வீழலின் நீளம்."}, {"n": 688, "c": 7, "t": "துணைச் செங்கோட்டின் நீளம் (Subnormal)", "e": "Length of Subnormal", "f": "Subnormal = |y_1 × (dy/dx)|", "d": "செங்கோட்டின் X-அச்சு வீழலின் நீளம்."}, {"n": 689, "c": 7, "t": "கூடும் சார்பு நிபந்தனை (Increasing Function)", "e": "Condition for Increasing Function", "f": "f'(x) > 0", "d": "ஒரு இடைவெளியில் முதல் வகைக்கெழு மிகை எனில் சார்பு கூடும்."}, {"n": 690, "c": 7, "t": "குறையும் சார்பு நிபந்தனை (Decreasing Function)", "e": "Condition for Decreasing Function", "f": "f'(x) < 0", "d": "ஒரு இடைவெளியில் முதல் வகைக்கெழு குறை எனில் சார்பு குறையும்."}, {"n": 691, "c": 7, "t": "இடஞ்சார்ந்த பெருமம் நிபந்தனை (Local Maximum)", "e": "Second Derivative Test for Local Maximum", "f": "f'(c) = 0  மற்றும்  f''(c) < 0", "d": "நிலைப்புள்ளியில் இரண்டாம் வகைக்கெழு குறை எனில் பெரும மதிப்பு உண்டு."}, {"n": 692, "c": 7, "t": "இடஞ்சார்ந்த சிறுமம் நிபந்தனை (Local Minimum)", "e": "Second Derivative Test for Local Minimum", "f": "f'(c) = 0  மற்றும்  f''(c) > 0", "d": "நிலைப்புள்ளியில் இரண்டாம் வகைக்கெழு மிகை எனில் சிறும மதிப்பு உண்டு."}, {"n": 693, "c": 7, "t": "வளைவு மாற்றப் புள்ளி நிபந்தனை (Inflection Point)", "e": "Condition for Point of Inflection", "f": "f''(c) = 0  மற்றும் f''(x) குறி மாறுகிறது", "d": "வளைவரையின் குழிவுத்தன்மை மாறும் புள்ளி."}, {"n": 694, "c": 7, "t": "வளைவரையின் வளைவு (Curvature κ)", "e": "Curvature of a Plane Curve y = f(x)", "f": "κ = |y''| / [1 + (y')^2]^(3/2)", "d": "ஒரு புள்ளியில் வளைவரை எவ்வளவு வேகமாக வளைகிறது என்பதன் அளவு."}, {"n": 695, "c": 7, "t": "வளைவு ஆரம் (Radius of Curvature ρ)", "e": "Radius of Curvature Formula", "f": "ρ = 1 / κ = [1 + (y')^2]^(3/2) / |y''|", "d": "வளைவு வட்டத்தின் ஆரம்."}, {"n": 696, "c": 7, "t": "நேரியல் தோராயமாக்கல் சூத்திரம்", "e": "Linear Approximation (Differential)", "f": "f(x + Δx) ≈ f(x) + f'(x)Δx", "d": "சிறிய மாற்றங்களுக்குச் சார்பின் மதிப்பைத் தோராயமாகக் காணல்."}, {"n": 697, "c": 7, "t": "உடனடி திசைவேகம் மற்றும் முடுக்கம்", "e": "Instantaneous Velocity and Acceleration", "f": "v(t) = ds/dt,   a(t) = dv/dt = d^2s/dt^2", "d": "இடப்பெயர்ச்சி s(t)-ன் முதல் வகைக்கெழு திசைவேகம், இரண்டாம் வகைக்கெழு முடுக்கம்."}, {"n": 698, "c": 7, "t": "பகுதி வகைக்கெழு வரையறை (∂f/∂x)", "e": "Partial Derivative with respect to x", "f": "∂f/∂x = lim_(h→0) [f(x + h, y) - f(x, y)] / h", "d": "y-ஐ மாறிலியாக வைத்து x பொறுத்து வகைப்படுத்தல்."}, {"n": 699, "c": 7, "t": "கிளெய்ராட் தேற்றம் (கலப்பு பகுதி வகைக்கெழு)", "e": "Clairaut's Theorem (Mixed Partials)", "f": "∂^2f / (∂x∂y) = ∂^2f / (∂y∂x)", "d": "இரண்டாம் வரிசை பகுதி வகைக்கெழுக்கள் தொடர்ச்சியானவை எனில் வரிசை மாறாது."}, {"n": 700, "c": 7, "t": "ஆய்லரின் சமபடித்தான சார்புத் தேற்றம்", "e": "Euler's Theorem on Homogeneous Functions", "f": "x(∂f/∂x) + y(∂f/∂y) = n × f(x, y)", "d": "n படி கொண்ட சமபடித்தான சார்பு f(x, y)-க்கான ஆய்லர் சூத்திரம்."}]}, {"id": 8, "name": "Integral Calculus Formulas", "f": [{"n": 701, "c": 8, "t": "பூஜ்ஜியத்தின் தொகையீடு", "e": "Integral of Zero", "f": "∫ 0 dx = C", "d": "C என்பது தொகையீட்டு மாறிலி (Constant of Integration)."}, {"n": 702, "c": 8, "t": "மாறிலியின் தொகையீடு", "e": "Integral of a Constant", "f": "∫ k dx = kx + C", "d": "k ஒரு மாறிலி; அதன் தொகையீடு kx + C ஆகும்."}, {"n": 703, "c": 8, "t": "அடுக்கு விதி (Power Rule)", "e": "Power Rule of Integration", "f": "∫ x^n dx = [x^(n + 1) / (n + 1)] + C  (n ≠ -1)", "d": "அடுக்கோடு 1-ஐ கூட்டி புதிய அடுக்கால் வகுக்க வேண்டும்."}, {"n": 704, "c": 8, "t": "1/x சார்பின் தொகையீடு", "e": "Integral of 1/x", "f": "∫ (1 / x) dx = ln|x| + C  (x ≠ 0)", "d": "n = -1 ஆக இருக்கும்போது 1/x-ன் தொகையீடு இயல் மடக்கை ஆகும்."}, {"n": 705, "c": 8, "t": "மாறிலிப் பெருக்கல் விதி", "e": "Constant Multiple Rule", "f": "∫ k × f(x) dx = k ∫ f(x) dx", "d": "மாறிலியைத் தொகையீட்டுக் குறிக்கு வெளியே எடுக்கலாம்."}, {"n": 706, "c": 8, "t": "கூட்டல் மற்றும் கழித்தல் விதி", "e": "Sum and Difference Rule", "f": "∫ [f(x) ± g(x)] dx = ∫ f(x) dx ± ∫ g(x) dx", "d": "இரு சார்புகளின் கூட்டல்/கழித்தலைத் தனித்தனியாகத் தொகையிடலாம்."}, {"n": 707, "c": 8, "t": "நேரியல் கோவையின் அடுக்கு விதி", "e": "Power Rule for Linear Expression", "f": "∫ (ax + b)^n dx = [(ax + b)^(n + 1) / (a(n + 1))] + C  (n ≠ -1)", "d": "x-ன் கெழு a-ஆல் வகுக்க வேண்டும்."}, {"n": 708, "c": 8, "t": "1 / (ax + b) தொகையீடு", "e": "Integral of 1 / (ax + b)", "f": "∫ [1 / (ax + b)] dx = (1 / a) ln|ax + b| + C", "d": "நேரியல் பகுதி கொண்ட பின்னத்தின் தொகையீடு."}, {"n": 709, "c": 8, "t": "இயல் அடுக்குக்குறிச் சார்பின் தொகையீடு", "e": "Integral of e^x", "f": "∫ e^x dx = e^x + C", "d": "e^x சார்பின் தொகையீடு அதே சார்பாகும்."}, {"n": 710, "c": 8, "t": "e^(ax) சார்பின் தொகையீடு", "e": "Integral of e^(ax)", "f": "∫ e^(ax) dx = (1 / a) e^(ax) + C  (a ≠ 0)", "d": "e^(ax) சார்பைத் தொகையிடும்போது a-ஆல் வகுக்க வேண்டும்."}, {"n": 711, "c": 8, "t": "பொது அடுக்குக்குறிச் சார்பின் தொகையீடு (a^x)", "e": "Integral of a^x", "f": "∫ a^x dx = [a^x / ln(a)] + C  (a > 0, a ≠ 1)", "d": "a அடிமானம் கொண்ட அடுக்குக்குறிச் சார்பின் தொகையீடு."}, {"n": 712, "c": 8, "t": "இயல் மடக்கையின் தொகையீடு (ln x)", "e": "Integral of ln x", "f": "∫ ln(x) dx = x ln(x) - x + C  (x > 0)", "d": "பகுதித் தொகையீட்டு முறை மூலம் பெறப்படும் சூத்திரம்."}, {"n": 713, "c": 8, "t": "பொது மடக்கையின் தொகையீடு (log_a x)", "e": "Integral of log_a x", "f": "∫ log_a(x) dx = [x ln(x) - x] / ln(a) + C", "d": "a அடிமானம் கொண்ட மடக்கையின் தொகையீடு."}, {"n": 714, "c": 8, "t": "sin x தொகையீடு", "e": "Integral of sin x", "f": "∫ sin(x) dx = -cos(x) + C", "d": "சைன் சார்பின் தொகையீடு எதிர் கொசைன் ஆகும்."}, {"n": 715, "c": 8, "t": "cos x தொகையீடு", "e": "Integral of cos x", "f": "∫ cos(x) dx = sin(x) + C", "d": "கொசைன் சார்பின் தொகையீடு சைன் ஆகும்."}, {"n": 716, "c": 8, "t": "tan x தொகையீடு", "e": "Integral of tan x", "f": "∫ tan(x) dx = ln|sec(x)| + C = -ln|cos(x)| + C", "d": "டேன்ஜென்ட் சார்பின் தொகையீடு."}, {"n": 717, "c": 8, "t": "cot x தொகையீடு", "e": "Integral of cot x", "f": "∫ cot(x) dx = ln|sin(x)| + C", "d": "கோடேன்ஜென்ட் சார்பின் தொகையீடு."}, {"n": 718, "c": 8, "t": "sec x தொகையீடு", "e": "Integral of sec x", "f": "∫ sec(x) dx = ln|sec(x) + tan(x)| + C", "d": "சீக்கன்ட் சார்பின் தொகையீடு."}, {"n": 719, "c": 8, "t": "csc x தொகையீடு", "e": "Integral of csc x", "f": "∫ csc(x) dx = ln|csc(x) - cot(x)| + C = -ln|csc(x) + cot(x)| + C", "d": "கொசீக்கன்ட் சார்பின் தொகையீடு."}, {"n": 720, "c": 8, "t": "sec²x தொகையீடு", "e": "Integral of sec^2(x)", "f": "∫ sec^2(x) dx = tan(x) + C", "d": "tan x-ன் வகைக்கெழு sec²x என்பதால் அதன் தொகையீடு tan x."}, {"n": 721, "c": 8, "t": "csc²x தொகையீடு", "e": "Integral of csc^2(x)", "f": "∫ csc^2(x) dx = -cot(x) + C", "d": "cot x-ன் வகைக்கெழு -csc²x என்பதால் அதன் தொகையீடு -cot x."}, {"n": 722, "c": 8, "t": "sec x tan x தொகையீடு", "e": "Integral of sec x tan x", "f": "∫ sec(x) tan(x) dx = sec(x) + C", "d": "sec x சார்பின் எதிர் வகைக்கெழு."}, {"n": 723, "c": 8, "t": "csc x cot x தொகையீடு", "e": "Integral of csc x cot x", "f": "∫ csc(x) cot(x) dx = -csc(x) + C", "d": "csc x சார்பின் எதிர் வகைக்கெழு."}, {"n": 724, "c": 8, "t": "sin²x தொகையீடு", "e": "Integral of sin^2(x)", "f": "∫ sin^2(x) dx = (x / 2) - [sin(2x) / 4] + C", "d": "அரைக்கோணச் சூத்திரம் (1 - cos 2x)/2 பயன்படுத்தித் தொகையிடல்."}, {"n": 725, "c": 8, "t": "cos²x தொகையீடு", "e": "Integral of cos^2(x)", "f": "∫ cos^2(x) dx = (x / 2) + [sin(2x) / 4] + C", "d": "அரைக்கோணச் சூத்திரம் (1 + cos 2x)/2 பயன்படுத்தித் தொகையிடல்."}, {"n": 726, "c": 8, "t": "tan²x தொகையீடு", "e": "Integral of tan^2(x)", "f": "∫ tan^2(x) dx = tan(x) - x + C", "d": "tan²x = sec²x - 1 முற்றொருமை பயன்படுத்தித் தொகையிடல்."}, {"n": 727, "c": 8, "t": "cot²x தொகையீடு", "e": "Integral of cot^2(x)", "f": "∫ cot^2(x) dx = -cot(x) - x + C", "d": "cot²x = csc²x - 1 முற்றொருமை பயன்படுத்தித் தொகையிடல்."}, {"n": 728, "c": 8, "t": "sin(ax) தொகையீடு", "e": "Integral of sin(ax)", "f": "∫ sin(ax) dx = -(1 / a) cos(ax) + C", "d": "a ஒரு பூஜ்ஜியமற்ற மாறிலி."}, {"n": 729, "c": 8, "t": "cos(ax) தொகையீடு", "e": "Integral of cos(ax)", "f": "∫ cos(ax) dx = (1 / a) sin(ax) + C", "d": "a ஒரு பூஜ்ஜியமற்ற மாறிலி."}, {"n": 730, "c": 8, "t": "sinh x தொகையீடு", "e": "Integral of sinh x", "f": "∫ sinh(x) dx = cosh(x) + C", "d": "அதிபரவளைய சைன் சார்பின் தொகையீடு."}, {"n": 731, "c": 8, "t": "cosh x தொகையீடு", "e": "Integral of cosh x", "f": "∫ cosh(x) dx = sinh(x) + C", "d": "அதிபரவளைய கொசைன் சார்பின் தொகையீடு."}, {"n": 732, "c": 8, "t": "tanh x தொகையீடு", "e": "Integral of tanh x", "f": "∫ tanh(x) dx = ln(cosh x) + C", "d": "அதிபரவளைய டேன்ஜென்ட் சார்பின் தொகையீடு."}, {"n": 733, "c": 8, "t": "coth x தொகையீடு", "e": "Integral of coth x", "f": "∫ coth(x) dx = ln|sinh x| + C", "d": "அதிபரவளைய கோடேன்ஜென்ட் சார்பின் தொகையீடு."}, {"n": 734, "c": 8, "t": "sech²x தொகையீடு", "e": "Integral of sech^2(x)", "f": "∫ sech^2(x) dx = tanh(x) + C", "d": "அதிபரவளைய சீக்கன்ட் வர்க்கத்தின் தொகையீடு."}, {"n": 735, "c": 8, "t": "csch²x தொகையீடு", "e": "Integral of csch^2(x)", "f": "∫ csch^2(x) dx = -coth(x) + C", "d": "அதிபரவளைய கொசீக்கன்ட் வர்க்கத்தின் தொகையீடு."}, {"n": 736, "c": 8, "t": "sech x tanh x தொகையீடு", "e": "Integral of sech x tanh x", "f": "∫ sech(x) tanh(x) dx = -sech(x) + C", "d": "அதிபரவளைய பெருக்கல் சார்பின் தொகையீடு."}, {"n": 737, "c": 8, "t": "csch x coth x தொகையீடு", "e": "Integral of csch x coth x", "f": "∫ csch(x) coth(x) dx = -csch(x) + C", "d": "அதிபரவளைய பெருக்கல் சார்பின் தொகையீடு."}, {"n": 738, "c": 8, "t": "பிரதியிடல் விதி (Substitution Rule)", "e": "Integration by Substitution (u-Substitution)", "f": "∫ f(g(x)) g'(x) dx = ∫ f(u) du  (இங்கு u = g(x))", "d": "சங்கிலி விதியின் நேர்மாறான தொகையீட்டு முறை."}, {"n": 739, "c": 8, "t": "பகுதித் தொகையீட்டு விதி (Integration by Parts)", "e": "Integration by Parts (ILATE Rule)", "f": "∫ u dv = uv - ∫ v du", "d": "இரண்டு சார்புகளின் பெருக்கலைத் தொகையிடும் முக்கியச் சூத்திரம்."}, {"n": 740, "c": 8, "t": "பெர்னௌலியின் பொது பகுதித் தொகையீடு", "e": "Bernoulli's Generalized Integration by Parts", "f": "∫ u v dx = u v_1 - u' v_2 + u'' v_3 - u''' v_4 + ...", "d": "பல்லுறுப்புக்கோவை மற்றும் அடுக்கு/திரிகோணமிதி பெருக்கலுக்கான குறுக்கு வழி."}, {"n": 741, "c": 8, "t": "e^x [f(x) + f'(x)] தொகையீடு", "e": "Integral of e^x [f(x) + f'(x)]", "f": "∫ e^x [f(x) + f'(x)] dx = e^x f(x) + C", "d": "போட்டித் தேர்வுகளில் மிக அதிகமாகப் பயன்படும் சிறப்புச் சூத்திரம்."}, {"n": 742, "c": 8, "t": "f'(x) / f(x) தொகையீடு", "e": "Logarithmic Derivative Integral", "f": "∫ [f'(x) / f(x)] dx = ln|f(x)| + C", "d": "பகுதியின் வகைக்கெழு தொகுதியில் இருந்தால் விடை ln|பகுதி|."}, {"n": 743, "c": 8, "t": "f'(x) / √f(x) தொகையீடு", "e": "Radical Derivative Integral", "f": "∫ [f'(x) / √f(x)] dx = 2√f(x) + C", "d": "வர்க்கமூலத்திற்குள் உள்ள சார்பின் வகைக்கெழு தொகுதியில் இருந்தால்."}, {"n": 744, "c": 8, "t": "[f(x)]^n f'(x) தொகையீடு", "e": "Generalized Power Integral", "f": "∫ [f(x)]^n f'(x) dx = ([f(x)]^(n + 1) / (n + 1)) + C  (n ≠ -1)", "d": "சார்பின் அடுக்கும் அதன் வகைக்கெழுவும் பெருக்கலில் இருந்தால்."}, {"n": 745, "c": 8, "t": "திட்ட வடிவம் 1: 1 / (x^2 + a^2)", "e": "Standard Integral 1: 1 / (x^2 + a^2)", "f": "∫ [1 / (x^2 + a^2)] dx = (1 / a) arctan(x / a) + C", "d": "நேர்மாறு டேன்ஜென்ட் வடிவத் தொகையீடு."}, {"n": 746, "c": 8, "t": "திட்ட வடிவம் 2: 1 / (x^2 - a^2)", "e": "Standard Integral 2: 1 / (x^2 - a^2)", "f": "∫ [1 / (x^2 - a^2)] dx = [1 / (2a)] ln|(x - a) / (x + a)| + C", "d": "பகுதி பின்னங்கள் மூலம் பெறப்படும் திட்டத் தொகையீடு."}, {"n": 747, "c": 8, "t": "திட்ட வடிவம் 3: 1 / (a^2 - x^2)", "e": "Standard Integral 3: 1 / (a^2 - x^2)", "f": "∫ [1 / (a^2 - x^2)] dx = [1 / (2a)] ln|(a + x) / (a - x)| + C", "d": "a^2 - x^2 பகுதி கொண்ட திட்டத் தொகையீடு."}, {"n": 748, "c": 8, "t": "திட்ட வடிவம் 4: 1 / √(a^2 - x^2)", "e": "Standard Integral 4: 1 / √(a^2 - x^2)", "f": "∫ [1 / √(a^2 - x^2)] dx = arcsin(x / a) + C  (a > 0)", "d": "நேர்மாறு சைன் வடிவத் தொகையீடு."}, {"n": 749, "c": 8, "t": "திட்ட வடிவம் 5: 1 / √(x^2 + a^2)", "e": "Standard Integral 5: 1 / √(x^2 + a^2)", "f": "∫ [1 / √(x^2 + a^2)] dx = ln|x + √(x^2 + a^2)| + C = arsinh(x/a) + C", "d": "மடக்கை அல்லது நேர்மாறு அதிபரவளைய சைன் வடிவம்."}, {"n": 750, "c": 8, "t": "திட்ட வடிவம் 6: 1 / √(x^2 - a^2)", "e": "Standard Integral 6: 1 / √(x^2 - a^2)", "f": "∫ [1 / √(x^2 - a^2)] dx = ln|x + √(x^2 - a^2)| + C", "d": "x^2 - a^2 வர்க்கமூலப் பகுதி கொண்ட தொகையீடு."}, {"n": 751, "c": 8, "t": "திட்ட வடிவம் 7: 1 / [x√(x^2 - a^2)]", "e": "Standard Integral 7: 1 / [x√(x^2 - a^2)]", "f": "∫ [1 / (x√(x^2 - a^2))] dx = (1 / a) arcsec(|x| / a) + C", "d": "நேர்மாறு சீக்கன்ட் வடிவத் தொகையீடு."}, {"n": 752, "c": 8, "t": "சிறப்பு வடிவம் 8: √(a^2 - x^2)", "e": "Special Integral 8: √(a^2 - x^2)", "f": "∫ √(a^2 - x^2) dx = (x / 2)√(a^2 - x^2) + (a^2 / 2) arcsin(x / a) + C", "d": "வட்டத்தின் பரப்பளவு காணப் பயன்படும் முக்கியத் தொகையீடு."}, {"n": 753, "c": 8, "t": "சிறப்பு வடிவம் 9: √(x^2 + a^2)", "e": "Special Integral 9: √(x^2 + a^2)", "f": "∫ √(x^2 + a^2) dx = (x / 2)√(x^2 + a^2) + (a^2 / 2) ln|x + √(x^2 + a^2)| + C", "d": "பரவளைய வில்லின் நீளம் காணப் பயன்படும் தொகையீடு."}, {"n": 754, "c": 8, "t": "சிறப்பு வடிவம் 10: √(x^2 - a^2)", "e": "Special Integral 10: √(x^2 - a^2)", "f": "∫ √(x^2 - a^2) dx = (x / 2)√(x^2 - a^2) - (a^2 / 2) ln|x + √(x^2 - a^2)| + C", "d": "அதிபரவளையப் பரப்பளவு காணப் பயன்படும் தொகையீடு."}, {"n": 755, "c": 8, "t": "e^(ax) sin(bx) தொகையீடு", "e": "Integral of e^(ax) sin(bx)", "f": "∫ e^(ax) sin(bx) dx = [e^(ax) / (a^2 + b^2)] (a sin bx - b cos bx) + C", "d": "அடுக்குக்குறி மற்றும் சைன் பெருக்கலின் நேரடிச் சூத்திரம்."}, {"n": 756, "c": 8, "t": "e^(ax) cos(bx) தொகையீடு", "e": "Integral of e^(ax) cos(bx)", "f": "∫ e^(ax) cos(bx) dx = [e^(ax) / (a^2 + b^2)] (a cos bx + b sin bx) + C", "d": "அடுக்குக்குறி மற்றும் கொசைன் பெருக்கலின் நேரடிச் சூத்திரம்."}, {"n": 757, "c": 8, "t": "sin^n(x) குறைப்புச் சூத்திரம்", "e": "Reduction Formula for sin^n(x)", "f": "∫ sin^n(x) dx = -(1/n) sin^(n-1)(x) cos(x) + [(n-1)/n] ∫ sin^(n-2)(x) dx", "d": "உயர் அடுக்கு சைன் தொகையீட்டைக் குறைக்கும் சூத்திரம்."}, {"n": 758, "c": 8, "t": "cos^n(x) குறைப்புச் சூத்திரம்", "e": "Reduction Formula for cos^n(x)", "f": "∫ cos^n(x) dx = (1/n) cos^(n-1)(x) sin(x) + [(n-1)/n] ∫ cos^(n-2)(x) dx", "d": "உயர் அடுக்கு கொசைன் தொகையீட்டைக் குறைக்கும் சூத்திரம்."}, {"n": 759, "c": 8, "t": "tan^n(x) குறைப்புச் சூத்திரம்", "e": "Reduction Formula for tan^n(x)", "f": "∫ tan^n(x) dx = [tan^(n-1)(x) / (n - 1)] - ∫ tan^(n-2)(x) dx  (n ≠ 1)", "d": "உயர் அடுக்கு டேன்ஜென்ட் தொகையீட்டைக் குறைக்கும் சூத்திரம்."}, {"n": 760, "c": 8, "t": "sec^n(x) குறைப்புச் சூத்திரம்", "e": "Reduction Formula for sec^n(x)", "f": "∫ sec^n(x) dx = [sec^(n-2)(x) tan(x) / (n-1)] + [(n-2)/(n-1)] ∫ sec^(n-2)(x) dx", "d": "உயர் அடுக்கு சீக்கன்ட் தொகையீட்டைக் குறைக்கும் சூத்திரம்."}, {"n": 761, "c": 8, "t": "நுண்கணிதத்தின் அடிப்படைத் தேற்றம் 1", "e": "Fundamental Theorem of Calculus (Part 1)", "f": "d/dx [ ∫_a^x f(t) dt ] = f(x)", "d": "தொகையீடும் வகைக்கெழுவும் ஒன்றுக்கொன்று எதிர்ச் செயல்கள்."}, {"n": 762, "c": 8, "t": "நுண்கணிதத்தின் அடிப்படைத் தேற்றம் 2 (நியூட்டன்-லீப்னிட்ஸ்)", "e": "Fundamental Theorem of Calculus (Part 2)", "f": "∫_a^b f(x) dx = F(b) - F(a)  (இங்கு F'(x) = f(x))", "d": "வரையறுத்த தொகையீட்டின் மதிப்பைக் காணும் அடிப்படைச் சூத்திரம்."}, {"n": 763, "c": 8, "t": "ரீமான் கூட்டல் வரையறை (Definite Integral)", "e": "Riemann Sum Definition of Definite Integral", "f": "∫_a^b f(x) dx = lim_(n→∞) Σ [f(x_i*) × Δx]  (Δx = (b - a)/n)", "d": "வரையறுத்த தொகையீட்டின் எல்லை வரையறை."}, {"n": 764, "c": 8, "t": "எல்லைகள் சமமாக உள்ள வரையறுத்த தொகையீடு", "e": "Zero-Width Interval Property", "f": "∫_a^a f(x) dx = 0", "d": "கீழ் எல்லையும் மேல் எல்லையும் சமமாக இருந்தால் தொகையீடு 0."}, {"n": 765, "c": 8, "t": "எல்லைகளை இடமாற்றும் பண்பு", "e": "Reversing Limits of Integration", "f": "∫_a^b f(x) dx = - ∫_b^a f(x) dx", "d": "தொகையீட்டு எல்லைகளை மாற்றினால் குறி மாறும்."}, {"n": 766, "c": 8, "t": "இடைவெளி கூட்டல் பண்பு", "e": "Interval Additivity Property", "f": "∫_a^b f(x) dx = ∫_a^c f(x) dx + ∫_c^b f(x) dx", "d": "a < c < b எனும்போது இடைவெளியை இரண்டாகப் பிரித்தல்."}, {"n": 767, "c": 8, "t": "மாறி மாற்றப் பண்பு (Dummy Variable)", "e": "Change of Variable Property", "f": "∫_a^b f(x) dx = ∫_a^b f(t) dt", "d": "மாறியின் பெயரை மாற்றினாலும் வரையறுத்த தொகையீடு மாறாது."}, {"n": 768, "c": 8, "t": "கிங் பண்பு (King's Property)", "e": "King's Property of Definite Integrals", "f": "∫_a^b f(x) dx = ∫_a^b f(a + b - x) dx", "d": "வரையறுத்த தொகையீடுகளை எளிதாக்கப் பயன்படும் மிக முக்கியப் பண்பு."}, {"n": 769, "c": 8, "t": "0 முதல் a வரையிலான கிங் பண்பு", "e": "King's Property (0 to a)", "f": "∫_0^a f(x) dx = ∫_0^a f(a - x) dx", "d": "0 முதல் a வரையிலான எல்லைகளுக்குப் பயன்படும் சிறப்பு வடிவம்."}, {"n": 770, "c": 8, "t": "இரட்டைச் சார்புக்கான சமச்சீர் எல்லைப் பண்பு", "e": "Even Function Symmetry Property", "f": "∫_(-a)^a f(x) dx = 2 ∫_0^a f(x) dx  (if f(-x) = f(x))", "d": "f(x) இரட்டைச் சார்பாக இருந்தால் 0 முதல் a வரை இருமடங்காகும்."}, {"n": 771, "c": 8, "t": "ஒற்றைச் சார்புக்கான சமச்சீர் எல்லைப் பண்பு", "e": "Odd Function Symmetry Property", "f": "∫_(-a)^a f(x) dx = 0  (if f(-x) = -f(x))", "d": "f(x) ஒற்றைச் சார்பாக இருந்தால் -a முதல் a வரை தொகையீடு 0."}, {"n": 772, "c": 8, "t": "0 முதல் 2a வரையிலான பண்பு (வகை 1)", "e": "Property for 0 to 2a (Type 1)", "f": "∫_0^(2a) f(x) dx = 2 ∫_0^a f(x) dx  (if f(2a - x) = f(x))", "d": "f(2a - x) = f(x) எனில் தொகையீடு இருமடங்காகும்."}, {"n": 773, "c": 8, "t": "0 முதல் 2a வரையிலான பண்பு (வகை 2)", "e": "Property for 0 to 2a (Type 2)", "f": "∫_0^(2a) f(x) dx = 0  (if f(2a - x) = -f(x))", "d": "f(2a - x) = -f(x) எனில் தொகையீடு பூஜ்ஜியமாகும்."}, {"n": 774, "c": 8, "t": "காலமுறைச் சார்புகளின் தொகையீட்டுப் பண்பு", "e": "Periodic Function Integral Property", "f": "∫_0^(nT) f(x) dx = n ∫_0^T f(x) dx  (if f(x + T) = f(x))", "d": "T காலமுறை கொண்ட சார்பிற்கு n சுற்றுகளின் தொகையீடு."}, {"n": 775, "c": 8, "t": "வாலிஸ் சூத்திரம் (Wallis's Formula - n ஒற்றை)", "e": "Wallis's Formula (n is Odd)", "f": "∫_0^(π/2) sin^n(x) dx = [(n-1)/n] × [(n-3)/(n-2)] × ... × (2/3)", "d": "0 முதல் π/2 வரை sin^n(x) அல்லது cos^n(x) மதிப்பு (n ≥ 3 ஒற்றை)."}, {"n": 776, "c": 8, "t": "வாலிஸ் சூத்திரம் (Wallis's Formula - n இரட்டை)", "e": "Wallis's Formula (n is Even)", "f": "∫_0^(π/2) sin^n(x) dx = [(n-1)/n] × [(n-3)/(n-2)] × ... × (1/2) × (π/2)", "d": "0 முதல் π/2 வரை sin^n(x) அல்லது cos^n(x) மதிப்பு (n ≥ 2 இரட்டை)."}, {"n": 777, "c": 8, "t": "லீப்னிட்ஸ் தொகையீட்டு விதி (எல்லை வகைப்படுத்தல்)", "e": "Leibniz Integral Rule (Differentiation under Integral)", "f": "d/dx [ ∫_(a(x))^(b(x)) f(t) dt ] = f(b(x)) b'(x) - f(a(x)) a'(x)", "d": "மாறும் எல்லைகள் கொண்ட தொகையீட்டை வகைப்படுத்தும் சூத்திரம்."}, {"n": 778, "c": 8, "t": "சார்பின் சராசரி மதிப்பு", "e": "Average Value of a Function", "f": "f_avg = [1 / (b - a)] ∫_a^b f(x) dx", "d": "[a, b] இடைவெளியில் f(x) சார்பின் சராசரி மதிப்பு."}, {"n": 779, "c": 8, "t": "தொகையீடுகளுக்கான சராசரி மதிப்புத் தேற்றம்", "e": "Mean Value Theorem for Integrals", "f": "∫_a^b f(x) dx = f(c)(b - a)  (c ∈ [a, b])", "d": "தொடர்ச்சியான சார்புக்கு சராசரி மதிப்பை அடையும் புள்ளி c உண்டு."}, {"n": 780, "c": 8, "t": "X-அச்சைப் பொறுத்த வளைவரையின் கீழ் பரப்பளவு", "e": "Area Under a Curve (x-axis)", "f": "A = ∫_a^b |f(x)| dx", "d": "x = a முதல் x = b வரை வளைவரைக்கும் X-அச்சிற்கும் இடைப்பட்ட பரப்பு."}, {"n": 781, "c": 8, "t": "Y-அச்சைப் பொறுத்த வளைவரையின் பரப்பளவு", "e": "Area Bounded by Curve and y-axis", "f": "A = ∫_c^d |g(y)| dy", "d": "y = c முதல் y = d வரை வளைவரைக்கும் Y-அச்சிற்கும் இடைப்பட்ட பரப்பு."}, {"n": 782, "c": 8, "t": "இரு வளைவரைகளுக்கு இடைப்பட்ட பரப்பளவு", "e": "Area Between Two Curves", "f": "A = ∫_a^b |f(x) - g(x)| dx", "d": "மேல் வளைவரை f(x) மற்றும் கீழ் வளைவரை g(x)-க்கு இடைப்பட்ட பரப்பு."}, {"n": 783, "c": 8, "t": "துருவ வளைவரையின் பரப்பளவு", "e": "Area in Polar Coordinates", "f": "A = (1/2) ∫_α^β r^2 dθ", "d": "θ = α முதல் θ = β வரை r = f(θ) வளைவரை அடைக்கும் பரப்பு."}, {"n": 784, "c": 8, "t": "வளைவில்லின் நீளம் (கார்டீசியன் y = f(x))", "e": "Arc Length Formula (Cartesian y = f(x))", "f": "L = ∫_a^b √[1 + (dy/dx)^2] dx", "d": "a முதல் b வரையிலான வளைவரையின் மொத்த நீளம்."}, {"n": 785, "c": 8, "t": "வளைவில்லின் நீளம் (கார்டீசியன் x = g(y))", "e": "Arc Length Formula (Cartesian x = g(y))", "f": "L = ∫_c^d √[1 + (dx/dy)^2] dy", "d": "y-ஐப் பொறுத்த வளைவரையின் நீளம்."}, {"n": 786, "c": 8, "t": "வளைவில்லின் நீளம் (துணையலகு வடிவம்)", "e": "Arc Length Formula (Parametric)", "f": "L = ∫_(t_1)^(t_2) √[(dx/dt)^2 + (dy/dt)^2] dt", "d": "x = x(t), y = y(t) வளைவரையின் நீளம்."}, {"n": 787, "c": 8, "t": "வளைவில்லின் நீளம் (துருவ வடிவம்)", "e": "Arc Length Formula (Polar)", "f": "L = ∫_α^β √[r^2 + (dr/dθ)^2] dθ", "d": "துருவ வளைவரை r = f(θ)-ன் நீளம்."}, {"n": 788, "c": 8, "t": "சுழற்சித் திண்மத்தின் கனஅளவு (வட்டத்தட்டு முறை - X அச்சு)", "e": "Volume of Revolution (Disk Method - x-axis)", "f": "V = π ∫_a^b [f(x)]^2 dx", "d": "X-அச்சைப் பொறுத்து வளைவரையைச் சுழற்றும்போது உருவாகும் கனஅளவு."}, {"n": 789, "c": 8, "t": "சுழற்சித் திண்மத்தின் கனஅளவு (வளைய முறை - Washer)", "e": "Volume of Revolution (Washer Method)", "f": "V = π ∫_a^b ([R(x)]^2 - [r(x)]^2) dx", "d": "வெளி ஆரம் R(x) மற்றும் உள் ஆரம் r(x) கொண்ட சுழற்சித் திண்மம்."}, {"n": 790, "c": 8, "t": "சுழற்சித் திண்மத்தின் கனஅளவு (உருளை ஓடு முறை - Shell)", "e": "Volume of Revolution (Cylindrical Shell Method)", "f": "V = 2π ∫_a^b x × f(x) dx", "d": "Y-அச்சைப் பொறுத்து சுழற்றும்போது பயன்படும் உருளை ஓடு முறை."}, {"n": 791, "c": 8, "t": "சுழற்சி மேற்பரப்பின் பரப்பளவு (X-அச்சு)", "e": "Surface Area of Revolution (x-axis)", "f": "S = 2π ∫_a^b f(x) √[1 + (f'(x))^2] dx", "d": "X-அச்சைப் பொறுத்து வளைவரையைச் சுழற்றும்போது உருவாகும் வளைபரப்பு."}, {"n": 792, "c": 8, "t": "காமா சார்பு வரையறை (Gamma Function)", "e": "Gamma Function Definition", "f": "Γ(n) = ∫_0^∞ x^(n - 1) e^(-x) dx  (n > 0)", "d": "தொடர் பெருக்கத்தை (Factorial) மெய் எண்களுக்கு விரிவுபடுத்தும் சார்பு."}, {"n": 793, "c": 8, "t": "காமா சார்பு மீள்சுருள் மற்றும் முழு எண் பண்பு", "e": "Gamma Function Properties", "f": "Γ(n + 1) = n Γ(n)  மற்றும்  Γ(n + 1) = n!  (n ∈ N)", "d": "முழு எண்களுக்கு காமா சார்பு தொடர் பெருக்கத்திற்குச் சமம்."}, {"n": 794, "c": 8, "t": "காமா (1/2) மதிப்பு", "e": "Value of Gamma(1/2)", "f": "Γ(1/2) = √π", "d": "புள்ளியியல் மற்றும் தொகையீட்டில் பயன்படும் முக்கிய மதிப்பு."}, {"n": 795, "c": 8, "t": "பீட்டா சார்பு வரையறை (Beta Function)", "e": "Beta Function Definition", "f": "B(m, n) = ∫_0^1 x^(m - 1) (1 - x)^(n - 1) dx  (m, n > 0)", "d": "ஆய்லரின் முதல் வகைத் தொகையீடு."}, {"n": 796, "c": 8, "t": "பீட்டா மற்றும் காமா சார்பு தொடர்பு", "e": "Relation Between Beta and Gamma Functions", "f": "B(m, n) = [Γ(m) × Γ(n)] / Γ(m + n)", "d": "பீட்டா சார்பை காமா சார்புகள் மூலம் கணக்கிடும் சூத்திரம்."}, {"n": 797, "c": 8, "t": "காசியன் தொகையீடு (Gaussian Integral)", "e": "Gaussian Integral Formula", "f": "∫_(-∞)^∞ e^(-x^2) dx = √π", "d": "நிகழ்தகவு மற்றும் இயற்பியலில் மிக முக்கியமான முறையிலா தொகையீடு."}, {"n": 798, "c": 8, "t": "சரிவக விதி (Trapezoidal Rule)", "e": "Trapezoidal Rule for Numerical Integration", "f": "∫_a^b f(x) dx ≈ (h / 2) [y_0 + 2(y_1 + y_2 + ... + y_(n-1)) + y_n]", "d": "எண்முறைத் தொகையீட்டில் h = (b - a)/n."}, {"n": 799, "c": 8, "t": "சிம்சனின் 1/3 விதி (Simpson's 1/3 Rule)", "e": "Simpson's 1/3 Rule", "f": "∫_a^b f(x) dx ≈ (h / 3) [y_0 + 4(y_1+y_3+...) + 2(y_2+y_4+...) + y_n]", "d": "n இரட்டை எண்ணாக இருக்கும்போது மிகத் துல்லியமான தோராய விதி."}, {"n": 800, "c": 8, "t": "சிம்சனின் 3/8 விதி (Simpson's 3/8 Rule)", "e": "Simpson's 3/8 Rule", "f": "∫_a^b f(x) dx ≈ (3h / 8) [y_0 + 3(y_1+y_2+y_4+y_5+...) + 2(y_3+y_6+...) + y_n]", "d": "n என்பது 3-ன் மடங்காக இருக்கும்போது பயன்படும் எண்முறை விதி."}]}, {"id": 9, "name": "statistick and probability formulas", "f": [{"n": 801, "c": 9, "t": "கூட்டுச் சராசரி (தனித்த தரவு)", "e": "Arithmetic Mean (Ungrouped Data)", "f": "x̄ = (Σ x_i) / n", "d": "அனைத்துத் தரவு மதிப்புகளின் கூட்டுத்தொகையை மொத்த எண்ணிக்கையால் வகுத்தல்."}, {"n": 802, "c": 9, "t": "கூட்டுச் சராசரி (தொகுக்கப்பட்ட தரவு)", "e": "Arithmetic Mean (Grouped Data)", "f": "x̄ = (Σ f_i x_i) / (Σ f_i)", "d": "f_i = நிகழ்வெண், x_i = பிரிவு நடுப்புள்ளி."}, {"n": 803, "c": 9, "t": "ஊகச் சராசரி முறை (Assumed Mean)", "e": "Assumed Mean Method", "f": "x̄ = A + [(Σ f_i d_i) / (Σ f_i)]", "d": "A = ஊகச் சராசரி, d_i = x_i - A."}, {"n": 804, "c": 9, "t": "படி விலக்க முறைச் சராசரி", "e": "Step-Deviation Method for Mean", "f": "x̄ = A + [(Σ f_i u_i) / (Σ f_i)] × h", "d": "u_i = (x_i - A) / h, h = பிரிவு இடைவெளி."}, {"n": 805, "c": 9, "t": "எடையிட்ட சராசரி", "e": "Weighted Arithmetic Mean", "f": "x̄_w = (Σ w_i x_i) / (Σ w_i)", "d": "w_i = ஒவ்வொரு தரவுப் புள்ளியின் எடை."}, {"n": 806, "c": 9, "t": "பெருக்குச் சராசரி (n எண்கள்)", "e": "Geometric Mean (n Observations)", "f": "GM = (x_1 × x_2 × ... × x_n)^(1/n)", "d": "n தரவு மதிப்புகளின் பெருக்கற்பலனின் n-ஆம் மூலம்."}, {"n": 807, "c": 9, "t": "இசைச் சராசரி (n எண்கள்)", "e": "Harmonic Mean (n Observations)", "f": "HM = n / Σ (1 / x_i)", "d": "தலைகீழிகளின் கூட்டுச் சராசரியின் தலைகீழி."}, {"n": 808, "c": 9, "t": "இடைநிலை (ஒற்றை எண்ணிக்கை n)", "e": "Median (Odd Number of Observations)", "f": "Median = [(n + 1) / 2]-ஆவது உறுப்பு", "d": "ஏறுவரிசையில் அடுக்கப்பட்ட தரவின் நடு உறுப்பு."}, {"n": 809, "c": 9, "t": "இடைநிலை (இரட்டை எண்ணிக்கை n)", "e": "Median (Even Number of Observations)", "f": "Median = [(n/2)-ஆவது உறுப்பு + ((n/2) + 1)-ஆவது உறுப்பு] / 2", "d": "நடுவில் உள்ள இரு உறுப்புகளின் சராசரி."}, {"n": 810, "c": 9, "t": "இடைநிலை (தொகுக்கப்பட்ட தரவு)", "e": "Median (Grouped Data)", "f": "Median = L + [((N/2) - cf) / f] × h", "d": "L = இடைநிலைப் பிரிவின் கீழ் எல்லை, cf = முந்தைய குவிவு நிகழ்வெண்."}, {"n": 811, "c": 9, "t": "முகடு (தொகுக்கப்பட்ட தரவு)", "e": "Mode (Grouped Data)", "f": "Mode = L + [(f_1 - f_0) / (2f_1 - f_0 - f_2)] × h", "d": "f_1 = முகடு பிரிவின் நிகழ்வெண், f_0 = முந்தைய நிகழ்வெண், f_2 = அடுத்த நிகழ்வெண்."}, {"n": 812, "c": 9, "t": "சராசரி, இடைநிலை, முகடு அனுபவத் தொடர்பு", "e": "Empirical Relationship (Mean, Median, Mode)", "f": "Mode ≈ 3(Median) - 2(Mean)", "d": "மிதமான சமச்சீரற்ற பரவல்களில் இம்மூன்றிற்கும் உள்ள தொடர்பு."}, {"n": 813, "c": 9, "t": "வீச்சு (Range)", "e": "Range of Data", "f": "Range = L - S  (அதிகபட்ச மதிப்பு - குறைந்தபட்ச மதிப்பு)", "d": "தரவின் மிகப்பெரிய மற்றும் மிகச்சிறிய மதிப்புகளின் வித்தியாசம்."}, {"n": 814, "c": 9, "t": "வீச்சுக் கெழு", "e": "Coefficient of Range", "f": "Coefficient of Range = (L - S) / (L + S)", "d": "வீச்சின் ஒப்பீட்டு அளவை."}, {"n": 815, "c": 9, "t": "முதல் கால்மானம் (Q_1)", "e": "First Quartile (Q_1) Position", "f": "Q_1 = [(n + 1) / 4]-ஆவது உறுப்பு", "d": "தரவின் கீழ் 25% மதிப்புகளைப் பிரிக்கும் புள்ளி."}, {"n": 816, "c": 9, "t": "மூன்றாம் கால்மானம் (Q_3)", "e": "Third Quartile (Q_3) Position", "f": "Q_3 = [3(n + 1) / 4]-ஆவது உறுப்பு", "d": "தரவின் கீழ் 75% மதிப்புகளைப் பிரிக்கும் புள்ளி."}, {"n": 817, "c": 9, "t": "கால்மான இடைவெளி (IQR)", "e": "Interquartile Range (IQR)", "f": "IQR = Q_3 - Q_1", "d": "நடு 50% தரவுகளின் பரவல் அளவு."}, {"n": 818, "c": 9, "t": "கால்மான விலக்கம்", "e": "Quartile Deviation (Semi-IQR)", "f": "QD = (Q_3 - Q_1) / 2", "d": "கால்மான இடைவெளியில் பாதி."}, {"n": 819, "c": 9, "t": "கால்மான விலக்கக் கெழு", "e": "Coefficient of Quartile Deviation", "f": "Coefficient of QD = (Q_3 - Q_1) / (Q_3 + Q_1)", "d": "கால்மான விலக்கத்தின் ஒப்பீட்டு அளவை."}, {"n": 820, "c": 9, "t": "சராசரி விலக்கம் (சராசரியைப் பொறுத்து)", "e": "Mean Deviation about Mean", "f": "MD = [Σ |x_i - x̄|] / n", "d": "சராசரியிலிருந்து உள்ள தனிமதிப்பு விலக்கங்களின் சராசரி."}, {"n": 821, "c": 9, "t": "சராசரி விலக்கம் (இடைநிலையைப் பொறுத்து)", "e": "Mean Deviation about Median", "f": "MD = [Σ |x_i - M|] / n", "d": "இடைநிலையிலிருந்து உள்ள தனிமதிப்பு விலக்கங்களின் சராசரி."}, {"n": 822, "c": 9, "t": "முழுத்தொகுதி மாறுபாட்டு அளவை (Population Variance)", "e": "Population Variance (σ^2)", "f": "σ^2 = [Σ (x_i - μ)^2] / N", "d": "μ = முழுத்தொகுதி சராசரி, N = முழுத்தொகுதி எண்ணிக்கை."}, {"n": 823, "c": 9, "t": "மாதிரி மாறுபாட்டு அளவை (Sample Variance)", "e": "Sample Variance (s^2)", "f": "s^2 = [Σ (x_i - x̄)^2] / (n - 1)", "d": "n - 1 என்பது கட்டற்ற அளவுகள் (Degrees of Freedom)."}, {"n": 824, "c": 9, "t": "முழுத்தொகுதி திட்டவிலக்கம்", "e": "Population Standard Deviation (σ)", "f": "σ = √[ Σ (x_i - μ)^2 / N ]", "d": "மாறுபாட்டு அளவையின் வர்க்கமூலம்."}, {"n": 825, "c": 9, "t": "மாதிரி திட்டவிலக்கம்", "e": "Sample Standard Deviation (s)", "f": "s = √[ Σ (x_i - x̄)^2 / (n - 1) ]", "d": "மாதிரித் தரவின் திட்டவிலக்கம்."}, {"n": 826, "c": 9, "t": "திட்டவிலக்கக் குறுக்கு வழிச் சூத்திரம்", "e": "Shortcut Formula for Standard Deviation", "f": "σ = √[ (Σ x_i^2 / N) - (Σ x_i / N)^2 ]", "d": "கணக்கீட்டை எளிதாக்கும் மாற்று வடிவம்."}, {"n": 827, "c": 9, "t": "தொகுக்கப்பட்ட தரவின் திட்டவிலக்கம்", "e": "Standard Deviation (Grouped Data)", "f": "σ = √[ (Σ f_i (x_i - x̄)^2) / N ]", "d": "நிகழ்வெண் பரவலுக்கான திட்டவிலக்கம்."}, {"n": 828, "c": 9, "t": "மாறுபாட்டுக் கெழு (CV)", "e": "Coefficient of Variation (CV)", "f": "CV = (σ / x̄) × 100%", "d": "இரு தரவுத் தொகுப்புகளின் நிலைத்தன்மையை ஒப்பிடப் பயன்படும் சதவீத அளவு."}, {"n": 829, "c": 9, "t": "இணைந்த சராசரி (Combined Mean)", "e": "Combined Mean of Two Groups", "f": "x̄_12 = (n_1 x̄_1 + n_2 x̄_2) / (n_1 + n_2)", "d": "இரண்டு குழுக்களின் ஒன்றிணைந்த சராசரி."}, {"n": 830, "c": 9, "t": "இணைந்த மாறுபாட்டு அளவை", "e": "Combined Variance of Two Groups", "f": "σ_12^2 = [n_1(σ_1^2 + d_1^2) + n_2(σ_2^2 + d_2^2)] / (n_1 + n_2)", "d": "இங்கு d_1 = x̄_1 - x̄_12, d_2 = x̄_2 - x̄_12."}, {"n": 831, "c": 9, "t": "திட்ட மதிப்பெண் (Z-Score)", "e": "Standard Score (Z-Score)", "f": "Z = (x - μ) / σ", "d": "ஒரு தரவுப் புள்ளி சராசரியிலிருந்து எத்தனை திட்டவிலக்கங்கள் தொலைவில் உள்ளது."}, {"n": 832, "c": 9, "t": "பியர்சன் கோட்டக் கெழு 1 (முகடு)", "e": "Pearson's First Coefficient of Skewness", "f": "Sk_1 = (Mean - Mode) / σ", "d": "பரவலின் சமச்சீரற்ற தன்மையை அளவிடும் சூத்திரம்."}, {"n": 833, "c": 9, "t": "பியர்சன் கோட்டக் கெழு 2 (இடைநிலை)", "e": "Pearson's Second Coefficient of Skewness", "f": "Sk_2 = 3(Mean - Median) / σ", "d": "முகடு தெளிவாக இல்லாதபோது பயன்படும் கோட்டக் கெழு."}, {"n": 834, "c": 9, "t": "பௌலியின் கோட்டக் கெழு", "e": "Bowley's Coefficient of Skewness", "f": "Sk_B = (Q_3 + Q_1 - 2 × Median) / (Q_3 - Q_1)", "d": "கால்மானங்களை அடிப்படையாகக் கொண்ட கோட்டக் கெழு."}, {"n": 835, "c": 9, "t": "தட்டைத்தன்மை அளவை (Kurtosis)", "e": "Coefficient of Kurtosis (β_2)", "f": "β_2 = μ_4 / σ^4  (மிகை தட்டைத்தன்மை: γ_2 = β_2 - 3)", "d": "பரவலின் உச்சிப் பகுதியின் கூர்மையை அளவிடும் சூத்திரம்."}, {"n": 836, "c": 9, "t": "உடன்மாறுபாடு (Covariance)", "e": "Sample Covariance", "f": "Cov(X, Y) = [Σ (x_i - x̄)(y_i - ȳ)] / (n - 1)", "d": "இரண்டு மாறிகள் ஒன்றாக எவ்வாறு மாறுகின்றன என்பதன் அளவு."}, {"n": 837, "c": 9, "t": "கார்ல் பியர்சன் ஒட்டுறவுக் கெழு (r)", "e": "Pearson Correlation Coefficient (r)", "f": "r = Σ[(x_i - x̄)(y_i - ȳ)] / √[Σ(x_i - x̄)^2 × Σ(y_i - ȳ)^2]", "d": "-1 ≤ r ≤ +1; இரு மாறிகளுக்கு இடையிலான நேரியல் தொடர்பு."}, {"n": 838, "c": 9, "t": "உடன்மாறுபாடு மூலம் ஒட்டுறவுக் கெழு", "e": "Correlation via Covariance", "f": "r = Cov(X, Y) / (s_x × s_y)", "d": "திட்டவிலக்கங்கள் மூலம் ஒட்டுறவு காணல்."}, {"n": 839, "c": 9, "t": "ஸ்பியர்மேன் தர ஒட்டுறவுக் கெழு", "e": "Spearman's Rank Correlation Coefficient", "f": "ρ = 1 - [6 Σ d_i^2 / (n(n^2 - 1))]", "d": "d_i = இரு தரவரிசைகளுக்கு இடையிலான வித்தியாசம்."}, {"n": 840, "c": 9, "t": "நேரியல் தொடர்புப் போக்குச் சமன்பாடு (Y on X)", "e": "Linear Regression Line (Y on X)", "f": "y = a + bx,  இங்கு b_yx = r(σ_y / σ_x) = Cov(X,Y) / Var(X)", "d": "X மதிப்பிலிருந்து Y மதிப்பைக் கணிக்கும் சமன்பாடு."}, {"n": 841, "c": 9, "t": "நேரியல் தொடர்புப் போக்குச் சமன்பாடு (X on Y)", "e": "Linear Regression Line (X on Y)", "f": "x = c + dy,  இங்கு b_xy = r(σ_x / σ_y) = Cov(X,Y) / Var(Y)", "d": "Y மதிப்பிலிருந்து X மதிப்பைக் கணிக்கும் சமன்பாடு."}, {"n": 842, "c": 9, "t": "தொடர்புப் போக்குக் கெழுக்கள் மற்றும் r தொடர்பு", "e": "Relation Between Regression Coefficients and r", "f": "r^2 = b_yx × b_xy  மற்றும்  r = ±√(b_yx × b_xy)", "d": "இரு தொடர்புப் போக்குக் கெழுக்களின் பெருக்குச் சராசரி r ஆகும்."}, {"n": 843, "c": 9, "t": "துணிபுக் கெழு (Coefficient of Determination)", "e": "Coefficient of Determination (R^2)", "f": "R^2 = r^2 = SSR / SST", "d": "மாறியின் மாறுபாட்டில் மாதிரியால் விளக்கப்படும் விகிதம்."}, {"n": 844, "c": 9, "t": "நிகழ்தகவின் அடிப்படைச் சூத்திரம்", "e": "Classical Definition of Probability", "f": "P(A) = n(A) / n(S)", "d": "சாதகமான விளைவுகளின் எண்ணிக்கை / மொத்த சாத்தியமான விளைவுகள்."}, {"n": 845, "c": 9, "t": "நிகழ்தகவு எல்லை விதி", "e": "Range of Probability", "f": "0 ≤ P(A) ≤ 1", "d": "எந்தவொரு நிகழ்வின் நிகழ்தகவும் 0 முதல் 1 வரை மட்டுமே இருக்கும்."}, {"n": 846, "c": 9, "t": "நிரப்பு நிகழ்வின் நி
