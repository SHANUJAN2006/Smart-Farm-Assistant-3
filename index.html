கழ்தகவு", "e": "Complement Rule of Probability", "f": "P(A') = 1 - P(A)", "d": "ஒரு நிகழ்வு நடக்காமல் இருப்பதற்கான நிகழ்தகவு."}, {"n": 847, "c": 9, "t": "நிகழ்தகவு கூட்டல் விதி (பொது)", "e": "Addition Rule of Probability (General)", "f": "P(A ∪ B) = P(A) + P(B) - P(A ∩ B)", "d": "A அல்லது B நிகழ்வதற்கான நிகழ்தகவு."}, {"n": 848, "c": 9, "t": "ஒன்றையொன்று விலக்கும் நிகழ்வுகள் கூட்டல் விதி", "e": "Addition Rule for Mutually Exclusive Events", "f": "P(A ∪ B) = P(A) + P(B)  (P(A ∩ B) = 0)", "d": "ஒரே நேரத்தில் நிகழ முடியாத இரு நிகழ்வுகள்."}, {"n": 849, "c": 9, "t": "மூன்று நிகழ்வுகளுக்கான கூட்டல் விதி", "e": "Addition Rule for Three Events", "f": "P(A∪B∪C) = P(A)+P(B)+P(C) - P(A∩B) - P(B∩C) - P(C∩A) + P(A∩B∩C)", "d": "மூன்று நிகழ்வுகளில் குறைந்தது ஒன்று நிகழ நிகழ்தகவு."}, {"n": 850, "c": 9, "t": "நிபந்தனை நிகழ்தகவு (Conditional Probability)", "e": "Conditional Probability Formula", "f": "P(A | B) = P(A ∩ B) / P(B)  (P(B) > 0)", "d": "B நிகழ்ந்துவிட்ட நிலையில் A நிகழ்வதற்கான நிகழ்தகவு."}, {"n": 851, "c": 9, "t": "நிகழ்தகவு பெருக்கல் விதி (பொது)", "e": "General Multiplication Rule", "f": "P(A ∩ B) = P(A) × P(B | A) = P(B) × P(A | B)", "d": "A மற்றும் B இரண்டும் சேர்ந்து நிகழ்வதற்கான நிகழ்தகவு."}, {"n": 852, "c": 9, "t": "சார்பிலா நிகழ்வுகள் பெருக்கல் விதி", "e": "Multiplication Rule for Independent Events", "f": "P(A ∩ B) = P(A) × P(B)", "d": "A மற்றும் B ஒன்றையொன்று சாராத நிகழ்வுகள் எனில்."}, {"n": 853, "c": 9, "t": "மொத்த நிகழ்தகவுத் தேற்றம்", "e": "Law of Total Probability", "f": "P(A) = Σ [P(B_i) × P(A | B_i)]", "d": "B_i என்பவை கூறுவெளியின் பிரிவினைகள்."}, {"n": 854, "c": 9, "t": "பேயஸ் தேற்றம் (Bayes' Theorem)", "e": "Bayes' Theorem Formula", "f": "P(B_k | A) = [P(B_k) × P(A | B_k)] / Σ [P(B_i) × P(A | B_i)]", "d": "புதிய ஆதாரத்தின் அடிப்படையில் முன் நிகழ்தகவைப் புதுப்பிக்கும் தேற்றம்."}, {"n": 855, "c": 9, "t": "சாதக விகிதம் (Odds in Favor)", "e": "Odds in Favor of Event A", "f": "Odds in Favor = P(A) / [1 - P(A)]", "d": "நிகழ்வு நடப்பதற்கும் நடக்காமல் இருப்பதற்கும் உள்ள விகிதம்."}, {"n": 856, "c": 9, "t": "பாதக விகிதம் (Odds Against)", "e": "Odds Against Event A", "f": "Odds Against = [1 - P(A)] / P(A)", "d": "நிகழ்வு நடக்காமல் இருப்பதற்கும் நடப்பதற்கும் உள்ள விகிதம்."}, {"n": 857, "c": 9, "t": "தனித்த சமவாய்ப்பு மாறியின் எதிர்பார்ப்பு மதிப்பு", "e": "Expected Value (Discrete Random Variable)", "f": "E(X) = μ = Σ [x_i × P(X = x_i)]", "d": "சமவாய்ப்பு மாறியின் சராசரி மதிப்பு."}, {"n": 858, "c": 9, "t": "தொடர் சமவாய்ப்பு மாறியின் எதிர்பார்ப்பு மதிப்பு", "e": "Expected Value (Continuous Random Variable)", "f": "E(X) = ∫_(-∞)^∞ x × f(x) dx", "d": "f(x) = நிகழ்தகவு அடர்த்திச் சார்பு (PDF)."}, {"n": 859, "c": 9, "t": "எதிர்பார்ப்பு மதிப்பின் நேரியல் பண்பு", "e": "Linearity of Expectation", "f": "E(aX + bY + c) = a E(X) + b E(Y) + c", "d": "எந்தவொரு சமவாய்ப்பு மாறிகளுக்கும் பொருந்தும் முக்கியப் பண்பு."}, {"n": 860, "c": 9, "t": "சமவாய்ப்பு மாறியின் மாறுபாட்டு அளவை", "e": "Variance of a Random Variable", "f": "Var(X) = E[(X - μ)^2] = E(X^2) - [E(X)]^2", "d": "எதிர்பார்ப்பு மதிப்புகள் மூலம் மாறுபாட்டு அளவை காணல்."}, {"n": 861, "c": 9, "t": "மாறுபாட்டு அளவையின் நேரியல் மாற்றம்", "e": "Variance of Linear Transformation", "f": "Var(aX + b) = a^2 × Var(X)", "d": "மாறிலி b கூட்டுவதால் மாறுபாட்டு அளவை மாறாது."}, {"n": 862, "c": 9, "t": "சார்பிலா மாறிகளின் கூடுதல் மாறுபாட்டு அளவை", "e": "Variance of Sum of Independent Variables", "f": "Var(X ± Y) = Var(X) + Var(Y)", "d": "X மற்றும் Y சார்பிலா மாறிகள் எனில்."}, {"n": 863, "c": 9, "t": "சார்புள்ள மாறிகளின் கூடுதல் மாறுபாட்டு அளவை", "e": "Variance of Sum of Dependent Variables", "f": "Var(X + Y) = Var(X) + Var(Y) + 2 Cov(X, Y)", "d": "உடன்மாறுபாடு கொண்ட மாறிகளுக்கான சூத்திரம்."}, {"n": 864, "c": 9, "t": "பெர்னௌலி பரவல் (Bernoulli Distribution)", "e": "Bernoulli PMF, Mean, Variance", "f": "P(X = x) = p^x (1 - p)^(1 - x);  Mean = p,  Var = p(1 - p)", "d": "x ∈ {0, 1}; ஒரே ஒரு முயற்சிக்கான பரவல்."}, {"n": 865, "c": 9, "t": "ஈருறுப்புப் பரவல் (Binomial Distribution PMF)", "e": "Binomial Probability Mass Function", "f": "P(X = k) = nCk × p^k × q^(n - k)  (q = 1 - p)", "d": "n சுயாதீன முயற்சிகளில் k வெற்றிகள் கிடைப்பதற்கான நிகழ்தகவு."}, {"n": 866, "c": 9, "t": "ஈருறுப்புப் பரவல் சராசரி மற்றும் மாறுபாட்டு அளவை", "e": "Mean & Variance of Binomial Distribution", "f": "Mean (μ) = np,   Variance (σ^2) = npq", "d": "ஈருறுப்புப் பரவலின் முக்கியப் பண்பளவைகள்."}, {"n": 867, "c": 9, "t": "பாய்சான் பரவல் (Poisson Distribution PMF)", "e": "Poisson Probability Mass Function", "f": "P(X = k) = (λ^k × e^(-λ)) / k!  (k = 0, 1, 2, ...)", "d": "குறிப்பிட்ட நேரத்தில் அரிய நிகழ்வுகள் நடப்பதற்கான பரவல்."}, {"n": 868, "c": 9, "t": "பாய்சான் பரவல் சராசரி மற்றும் மாறுபாட்டு அளவை", "e": "Mean & Variance of Poisson Distribution", "f": "Mean (μ) = λ,   Variance (σ^2) = λ", "d": "பாய்சான் பரவலில் சராசரியும் மாறுபாட்டு அளவையும் சமம்."}, {"n": 869, "c": 9, "t": "வடிவியல் பரவல் (Geometric Distribution)", "e": "Geometric Distribution PMF & Mean", "f": "P(X = k) = (1 - p)^(k - 1) × p;   Mean = 1 / p,  Var = (1 - p) / p^2", "d": "முதல் வெற்றி கிடைக்கத் தேவைப்படும் k முயற்சிகளுக்கான பரவல்."}, {"n": 870, "c": 9, "t": "மிகை வடிவியல் பரவல் (Hypergeometric)", "e": "Hypergeometric Distribution PMF", "f": "P(X = k) = [K C k × (N - K) C (n - k)] / (N C n)", "d": "மீண்டும் வைக்காமல் தேர்ந்தெடுக்கும்போது ஏற்படும் பரவல்."}, {"n": 871, "c": 9, "t": "எதிர்மறை ஈருறுப்புப் பரவல்", "e": "Negative Binomial Distribution PMF", "f": "P(X = k) = (k - 1)C(r - 1) × p^r × (1 - p)^(k - r)", "d": "r-ஆவது வெற்றி கிடைக்கத் தேவைப்படும் k முயற்சிகளுக்கான பரவல்."}, {"n": 872, "c": 9, "t": "தொடர் சீரான பரவல் (Continuous Uniform)", "e": "Continuous Uniform PDF, Mean, Variance", "f": "f(x) = 1 / (b - a);  Mean = (a + b) / 2,  Var = (b - a)^2 / 12", "d": "[a, b] இடைவெளியில் சம வாய்ப்பு கொண்ட பரவல்."}, {"n": 873, "c": 9, "t": "அடுக்குக்குறிப் பரவல் (Exponential Distribution)", "e": "Exponential Distribution PDF, Mean, Variance", "f": "f(x) = λ e^(-λx) (x ≥ 0);  Mean = 1 / λ,  Var = 1 / λ^2", "d": "நிகழ்வுகளுக்கு இடைப்பட்ட நேரத்தை அளவிடும் பரவல்."}, {"n": 874, "c": 9, "t": "இயல்நிலைப் பரவல் (Normal Distribution PDF)", "e": "Normal (Gaussian) Distribution PDF", "f": "f(x) = [1 / (σ√(2π))] × exp( - (x - μ)^2 / (2σ^2) )", "d": "மணி வடிவ வளைவரை கொண்ட மிக முக்கியமான தொடர் பரவல்."}, {"n": 875, "c": 9, "t": "திட்ட இயல்நிலைப் பரவல் (Standard Normal PDF)", "e": "Standard Normal Distribution PDF (Z)", "f": "φ(z) = [1 / √(2π)] × e^(-z^2 / 2)  (μ = 0, σ = 1)", "d": "Z-பரவலின் நிகழ்தகவு அடர்த்திச் சார்பு."}, {"n": 876, "c": 9, "t": "அனுபவ விதி (68-95-99.7 விதி)", "e": "Empirical Rule (68-95-99.7 Rule)", "f": "μ±1σ: 68.27%,  μ±2σ: 95.45%,  μ±3σ: 99.73%", "d": "இயல்நிலைப் பரவலில் தரவு பரவியிருக்கும் சதவீதம்."}, {"n": 877, "c": 9, "t": "மத்திய எல்லைத் தேற்றம் (Central Limit Theorem)", "e": "Central Limit Theorem Formula", "f": "Z = (x̄ - μ) / (σ / √n)  →  N(0, 1) as n → ∞", "d": "பெரிய மாதிரிகளுக்கு மாதிரிச் சராசரி இயல்நிலைப் பரவலை அடையும்."}, {"n": 878, "c": 9, "t": "சராசரியின் திட்டப் பிழை (Standard Error)", "e": "Standard Error of the Sample Mean", "f": "SE = σ / √n  (அல்லது  s / √n)", "d": "மாதிரிச் சராசரியின் திட்டவிலக்கம்."}, {"n": 879, "c": 9, "t": "விகிதத்தின் திட்டப் பிழை", "e": "Standard Error of Sample Proportion", "f": "SE_p = √[ p(1 - p) / n ]", "d": "மாதிரி விகிதத்தின் திட்டவிலக்கம்."}, {"n": 880, "c": 9, "t": "மாதிரி சராசரிக்கான நம்பிக்கை இடைவெளி (σ தெரிந்தால்)", "e": "Confidence Interval for Mean (Known σ)", "f": "CI = x̄ ± Z_(α/2) × (σ / √n)", "d": "முழுத்தொகுதி திட்டவிலக்கம் தெரிந்தபோது நம்பிக்கை இடைவெளி."}, {"n": 881, "c": 9, "t": "மாதிரி சராசரிக்கான நம்பிக்கை இடைவெளி (σ தெரியாவிட்டால்)", "e": "Confidence Interval for Mean (Unknown σ)", "f": "CI = x̄ ± t_(α/2, df) × (s / √n)  (df = n - 1)", "d": "ஸ்டூடண்ட் t-பரவல் பயன்படுத்தி நம்பிக்கை இடைவெளி காணல்."}, {"n": 882, "c": 9, "t": "விகிதத்திற்கான நம்பிக்கை இடைவெளி", "e": "Confidence Interval for Proportion", "f": "CI = p̂ ± Z_(α/2) × √[ p̂(1 - p̂) / n ]", "d": "முழுத்தொகுதி விகிதத்திற்கான நம்பிக்கை இடைவெளி."}, {"n": 883, "c": 9, "t": "ஒற்றை மாதிரி Z-சோதனைப் புள்ளிவிவரம்", "e": "One-Sample Z-Test Statistic", "f": "Z = (x̄ - μ_0) / (σ / √n)", "d": "பெரிய மாதிரிகளுக்கான கருதுகோள் சோதனை."}, {"n": 884, "c": 9, "t": "ஒற்றை மாதிரி t-சோதனைப் புள்ளிவிவரம்", "e": "One-Sample t-Test Statistic", "f": "t = (x̄ - μ_0) / (s / √n)  (df = n - 1)", "d": "சிறிய மாதிரிகளுக்கான ஸ்டூடண்ட் t-சோதனை."}, {"n": 885, "c": 9, "t": "இரு மாதிரி t-சோதனைப் புள்ளிவிவரம்", "e": "Two-Sample t-Test Statistic", "f": "t = (x̄_1 - x̄_2) / √[ (s_1^2 / n_1) + (s_2^2 / n_2) ]", "d": "இரண்டு குழுக்களின் சராசரிகளை ஒப்பிடும் சோதனை."}, {"n": 886, "c": 9, "t": "கை-வர்க்க சோதனைப் புள்ளிவிவரம் (Chi-Square)", "e": "Chi-Square Test Statistic (χ^2)", "f": "χ^2 = Σ [ (O_i - E_i)^2 / E_i ]", "d": "O_i = கண்டறிந்த நிகழ்வெண், E_i = எதிர்பார்க்கப்பட்ட நிகழ்வெண்."}, {"n": 887, "c": 9, "t": "F-சோதனைப் புள்ளிவிவரம் (ANOVA)", "e": "F-Test Statistic", "f": "F = s_1^2 / s_2^2  = MSB / MSW", "d": "இரண்டு மாறுபாட்டு அளவைகளை ஒப்பிடும் சோதனை."}, {"n": 888, "c": 9, "t": "மார்கோவ் சமனிலி (Markov's Inequality)", "e": "Markov's Inequality", "f": "P(X ≥ a) ≤ E(X) / a  (X ≥ 0, a > 0)", "d": "எதிர்பார்ப்பு மதிப்பு மூலம் மேல் எல்லை நிகழ்தகவு காணல்."}, {"n": 889, "c": 9, "t": "செபிஷெவ் சமனிலி (Chebyshev's Inequality)", "e": "Chebyshev's Inequality", "f": "P(|X - μ| ≥ kσ) ≤ 1 / k^2  (k > 1)", "d": "எந்தவொரு பரவலுக்கும் k திட்டவிலக்கங்களுக்கு அப்பால் உள்ள நிகழ்தகவு."}, {"n": 890, "c": 9, "t": "குவிவுப் பரவல் சார்பு (CDF)", "e": "Cumulative Distribution Function (CDF)", "f": "F(x) = P(X ≤ x) = ∫_(-∞)^x f(t) dt", "d": "x அல்லது அதற்குக் குறைவான மதிப்பு கிடைக்கும் நிகழ்தகவு."}, {"n": 891, "c": 9, "t": "PDF மற்றும் CDF தொடர்பு", "e": "Relation Between PDF and CDF", "f": "f(x) = d/dx [F(x)]", "d": "குவிவுப் பரவல் சார்பின் வகைக்கெழு நிகழ்தகவு அடர்த்திச் சார்பு."}, {"n": 892, "c": 9, "t": "நிகழ்தகவு அடர்த்திச் சார்பு நிபந்தனை", "e": "Normalization Property of PDF", "f": "∫_(-∞)^∞ f(x) dx = 1  மற்றும்  f(x) ≥ 0", "d": "மொத்த நிகழ்தகவு பரப்பளவு 1-க்குச் சமம்."}, {"n": 893, "c": 9, "t": "விலக்க வர்க்கங்களின் கூடுதல் (Sum of Squares)", "e": "Algebraic Identity for Sum of Squares", "f": "Σ (x_i - x̄)^2 = Σ x_i^2 - [ (Σ x_i)^2 / n ]", "d": "மாறுபாட்டு அளவை கணக்கீட்டிற்கான இயற்கணிதச் சூத்திரம்."}, {"n": 894, "c": 9, "t": "சராசரி சார்புப் பிழை (MAPE)", "e": "Mean Absolute Percentage Error (MAPE)", "f": "MAPE = (100% / n) × Σ |(A_t - F_t) / A_t|", "d": "கணிப்புத் துல்லியத்தை அளவிடும் புள்ளியியல் சூத்திரம்."}, {"n": 895, "c": 9, "t": "சராசரி வர்க்கப் பிழை (MSE)", "e": "Mean Squared Error (MSE)", "f": "MSE = (1 / n) × Σ (y_i - ŷ_i)^2", "d": "கணிப்பு மதிப்புகளுக்கும் உண்மை மதிப்புகளுக்கும் உள்ள வர்க்கப் பிழை."}, {"n": 896, "c": 9, "t": "வர்க்கமூல சராசரி வர்க்கப் பிழை (RMSE)", "e": "Root Mean Squared Error (RMSE)", "f": "RMSE = √[ (1 / n) × Σ (y_i - ŷ_i)^2 ]", "d": "MSE-ன் வர்க்கமூலம்."}, {"n": 897, "c": 9, "t": "ஷானன் தகவல் என்ட்ரோபி (Entropy)", "e": "Shannon Information Entropy", "f": "H(X) = - Σ [P(x_i) × log_2 P(x_i)]", "d": "நிகழ்தகவுப் பரவலின் நிச்சயமற்ற தன்மையை அளவிடும் சூத்திரம்."}, {"n": 898, "c": 9, "t": "கூட்டு நிகழ்தகவு (சார்பிலா மாறிகள்)", "e": "Joint PDF of Independent Variables", "f": "f_(X,Y)(x, y) = f_X(x) × f_Y(y)", "d": "இரு தொடர் சமவாய்ப்பு மாறிகள் சார்பிலாதவை எனில்."}, {"n": 899, "c": 9, "t": "விளிம்பு நிகழ்தகவு (Marginal PDF)", "e": "Marginal Probability Density Function", "f": "f_X(x) = ∫_(-∞)^∞ f_(X,Y)(x, y) dy", "d": "கூட்டுப் பரவலிலிருந்து ஒரு மாறியின் பரவலை மட்டும் பெறுதல்."}, {"n": 900, "c": 9, "t": "விலகல் (Error) மற்றும் மாறுபாட்டு அளவை தொடர்பு (Bias-Variance)", "e": "Bias-Variance Decomposition", "f": "Expected Error = Bias^2 + Variance + Irreducible Error", "d": "புள்ளியியல் மற்றும் இயந்திரக் கற்றலில் (AI/ML) முக்கியச் சூத்திரம்."}]}, {"id": 10, "name": "commercial and maths formulas", "f": [{"n": 901, "c": 10, "t": "சதவீதம் காணல்", "e": "சதவீதம் & இலாப நட்டம்", "f": "(மதிப்பு / மொத்த மதிப்பு) × 100", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 902, "c": 10, "t": "சதவீத அதிகரிப்பு", "e": "சதவீதம் & இலாப நட்டம்", "f": "  10, "t": "விற்பனை விலை (தள்ளுபடி பின்)", "e": "சதவீதம் & இலாப நட்டம்", "f": "MP × [(100 - தள்ளுபடி%) / 100]", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 915, "c": 10, "t": "குறித்த விலை (Marked Price)", "e": "சதவீதம் & இலாப நட்டம்", "f": "SP × [100 / (100 - தள்ளுபடி%)]", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 916, "c": 10, "t": "தொடர் தள்ளுபடிகள் (x%, y%)", "e": "சதவீதம் & இலாப நட்டம்", "f": "ஒற்றைத் தள்ளுபடி % = x + y - (xy / 100)", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 917, "c": 10, "t": "தொடர் மாற்றம் (+x%, +y%)", "e": "சதவீதம் & இலாப நட்டம்", "f": "நிகர மாற்றம் % = x + y + (xy / 100)", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 918, "c": 10, "t": "தவறான எடை இலாப %", "e": "சதவீதம் & இலாப நட்டம்", "f": "[பிழை / (உண்மை எடை - பிழை)] × 100", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 919, "c": 10, "t": "சம இலாபம் & நட்டம் (x%)", "e": "சதவீதம் & இலாப நட்டம்", "f": "எப்போதும் நட்டம் % = (x² / 100)%", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 920, "c": 10, "t": "வரிக்குப் பின் விலை (GST/VAT)", "e": "சதவீதம் & இலாப நட்டம்", "f": "அடிப்படை விலை × [(100 + வரி%) / 100]", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 921, "c": 10, "t": "தனிவட்டி (Simple Interest - SI)", "e": "தனிவட்டி & கூட்டுவட்டி", "f": "(P × N × R) / 100", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 922, "c": 10, "t": "மொத்தத் தொகை (தனிவட்டி)", "e": "தனிவட்டி & கூட்டுவட்டி", "f": "A = P + SI = P[1 + (NR / 100)]", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 923, "c": 10, "t": "அசல் காணல் (Principal - P)", "e": "தனிவட்டி & கூட்டுவட்டி", "f": "(100 × SI) / (N × R)", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 924, "c": 10, "t": "வட்டி வீதம் காணல் (Rate - R)", "e": "தனிவட்டி & கூட்டுவட்டி", "f": "(100 × SI) / (P × N)", "d": "வணிகக் கணிதம் மற்றும் அளவீடு சூத்திரம்."}, {"n": 925, "c": 10, "t": "காலம் காணல் (Time - N)", "e": "தனிவட்டி & கூட்டுவட்டி", "f": "(100 × SI) / (P × R)", "d": "வணிக
